<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal sealed — contract</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Spectral:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#3A2B1E}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#E2C17C}a:hover{color:#F3DDA6}
.plaster{background-color:#4A4036;background-image:linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0) 30%, rgba(0,0,0,0.25)), radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5) 100%), url(assets/aac08c0c9c243ce7f17b60e7008ab1ee.jpg);background-size:auto, auto, 640px 640px}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.35), 0 5px 10px rgba(0,0,0,0.3), 0 20px 40px rgba(0,0,0,0.42) !important}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div class="plaster" style="min-height: 100vh; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 18px; line-height: 1.55">

<header style="max-width: 1440px; margin: 0 auto; padding: 22px 32px 18px; box-sizing: border-box; border-bottom: 1px solid rgba(226,193,124,0.25)">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.2em; color: #E9C982">OSTIA · THE WINE STALLS BY THE TIBER · JUST BEFORE SUNSET</span>
</header>

<main style="max-width: 1440px; margin: 0 auto; padding: 32px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">

<!-- THE HANDSHAKE -->
<div style="max-width: 760px; margin: 0 auto; text-align: center; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; color: #F2E8D5; font-size: 17px; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">Varro looks at you for a long moment. Demetrios shrugs and wanders off toward the quay. Then Varro reaches across the counter and clasps your forearm.</p>
<p style="margin: 0; color: #FFF6E4; text-shadow: 0 2px 6px rgba(0,0,0,0.7); font-size: 26px; font-family: Cinzel, serif; letter-spacing: 0.02em">"Twelve. Twelve days. And may Bacchus forgive us both."</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<!-- THE CONTRACT -->
<div class="paper" style="flex: 999 1 520px; min-width: 0; padding: 32px 36px; color: #2A2119; box-shadow: 0 22px 44px rgba(0,0,0,0.5); transform: rotate(-0.5deg); display: flex; flex-direction: column; gap: 18px; position: relative">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0) 33.1%, rgba(90,60,30,0.18) 33.4%, rgba(255,250,235,0.4) 33.8%, rgba(0,0,0,0) 34.4%, rgba(0,0,0,0) 66.1%, rgba(90,60,30,0.18) 66.4%, rgba(255,250,235,0.4) 66.8%, rgba(0,0,0,0) 67.4%)"></div>
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Cinzel, serif; font-size: 26px; font-weight: 700; letter-spacing: 0.1em; color: #3A2516">CONTRACT OF SALE</span>
<span style="font-size: 16px; color: #5E5042">Made at Ostia on the Ides of September, before the Collegium of Vintners · No. XLII in your archive</span>
</div>
<img src="assets/c69b764bc93209d5f2852599a2f5c2c1.png" alt="Varro's red wax seal: an amphora between his initials C, T, V" style="width: 140px; height: 140px; margin: -18px -10px -40px 0; transform: rotate(-12deg); filter: drop-shadow(0 8px 10px rgba(40,10,5,0.55)); flex: none">
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 17px; padding-bottom: 14px; border-bottom: 1px solid rgba(90,58,34,0.3)">
<span><span style="color: #6B5A48">Seller</span> &nbsp;Gaius Tullius Varro, vintner</span>
<span><span style="color: #6B5A48">Buyer</span> &nbsp;You</span>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 28px">
<sc-for list="{{terms}}" as="t" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 1px; border-bottom: 1px solid rgba(90,58,34,0.2); padding-bottom: 8px">
<span style="font-size: 13px; color: #6B5A48; letter-spacing: 0.04em">{{t.name}}</span>
<span style="font-size: 18px; color: #1F1710">{{t.value}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; padding-top: 4px">
<span style="font-family: Cinzel, serif; letter-spacing: 0.1em; font-size: 18px; color: #3A2516">SUMMA</span>
<span style="font-size: 22px; font-weight: 600; color: #1F1710"><span style="font-family: Cinzel, serif">MMCD</span> · 2,400 </span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding-top: 10px; border-top: 1px solid rgba(90,58,34,0.3)">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #3A2516">WHAT HAPPENS WHEN</span>
<sc-for list="{{schedule}}" as="s" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px; align-items: baseline">
<span style="{{s.whenStyle}}">{{s.when}}</span>
<span style="font-size: 17px; color: #1F1710">{{s.what}}</span>
<span style="{{s.tagStyle}}">{{s.tag}}</span>
</div>
</sc-for>
</div>
</div>

<!-- RIGHT COLUMN -->
<div style="flex: 1 1 340px; max-width: 420px; display: flex; flex-direction: column; gap: 22px">

<!-- MINECRAFT -->
<div class="paper" style="padding: 18px 22px; color: #2A2119; box-shadow: 0 14px 30px rgba(0,0,0,0.4); transform: rotate(0.7deg); display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #3A2516">YOUR TRADE CHEST</span>
<span style="font-size: 14px; color: #5E5042">Ostia warehouse, in your Minecraft world</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{chest}}" as="c" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 10px; align-items: baseline; font-size: 16px">
<span style="{{c.style}}">{{c.text}}</span>
<span style="font-size: 13px; color: #5E5042">{{c.when}}</span>
</div>
</sc-for>
</div>
<span style="font-size: 13px; color: #5E5042; border-top: 1px dashed rgba(90,58,34,0.3); padding-top: 8px">If the 1,600  isn't in the chest when it's due, Varro and the guild will hear of it.</span>
</div>

<!-- AFTERMATH -->
<div class="paper" style="padding: 18px 22px; color: #2A2119; box-shadow: 0 14px 30px rgba(0,0,0,0.4); transform: rotate(-0.6deg); display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #3A2516">WHAT CHANGED</span>
<span style="font-size: 16px">Varro thinks of you with <strong>grudging respect</strong>.</span>
<span style="font-size: 16px">Your read on him: <strong>Greedy</strong> <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5A3A22">●●●○ → ●●●●</span></span>
<span style="font-size: 16px">Word in Ostia: <strong>you drive a hard bargain</strong>.</span>
<span style="font-size: 16px; color: #8E2C1C">Rufus will notice you've stopped buying.</span>
</div>

<!-- JOURNAL -->
<div class="paper" style="padding: 18px 22px; color: #2A2119; box-shadow: 0 14px 30px rgba(0,0,0,0.4); transform: rotate(0.4deg); display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #3A2516">MY JOURNAL</span>
<p style="margin: 0; font-size: 17px; color: #1F1710">Ides of September, Ostia. Bought 200 jars of Falernian from Varro at twelve, in twelve days. He fought me on every coin, but the Greek at his stall did half my work for me. Ten days without Rufus. Rome had better still be paying seventeen.</p>
<span style="font-size: 13px; color: #5E5042">Written for you. You can add your own lines.</span>
</div>

<div style="display: flex; gap: 10px">
<button class="paper" style="flex: 1; min-height: 46px; color: #2A2119; border: 2px solid #5A3A22; border-radius: 2px; font-family: Spectral, serif; font-size: 17px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,0.35)">Add to journal</button>
<button style="flex: 1; min-height: 46px; background: #5A3A22; color: #FFF6E4; border: none; border-radius: 2px; font-family: Cinzel, serif; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; cursor: pointer; box-shadow: 0 6px 14px rgba(0,0,0,0.35)">Back to the market</button>
</div>
</div>
</div>
</main>
</div>
</template>
<script src="dc-runtime.js"></script>
<script>

class Component extends DCLogic {
  renderVals() {
    const tag = (kind) => 'font-size: 13px; padding: 2px 8px; border-radius: 2px; font-family: "IBM Plex Mono", monospace; ' +
      (kind === 'done' ? 'background: #D6E6DE; border: 1px solid #3F7A6A; color: #1F4A40'
       : kind === 'you' ? 'background: #F2D49A; border: 1px solid #8A5A12; color: #3E2808'
       : 'background: rgba(255,250,238,0.5); border: 1px solid rgba(90,58,34,0.35); color: #5E5042');
    const step = (when, what, label, kind) => ({ when, what, tag: label, tagStyle: tag(kind),
      whenStyle: 'font-family: Cinzel, serif; font-size: 15px; font-weight: 700; color: ' + (kind === 'done' ? '#3F7A6A' : '#7E2A1A') });
    return {
      terms: [
        { name: 'Goods', value: '200 jars of Falernian' },
        { name: 'Quality', value: 'Grade A' },
        { name: 'Price a jar', value: '12 ' },
        { name: 'Delivery', value: 'Within 12 days, to your warehouse' },
        { name: 'Payment', value: 'Three parts of 800 ' },
        { name: 'Your promise', value: 'No wine from Rufus for 10 days' },
        { name: 'Bundle', value: 'None' },
        { name: 'Guarantee', value: 'None' }
      ],
      schedule: [
        step('Today', 'First 800  taken from your trade chest', 'paid', 'done'),
        step('Day 10', 'Your promise ends: you may buy from Rufus again', 'promise', ''),
        step('Day 12', '200 jars arrive in your trade chest', 'his part', ''),
        step('Day 12', 'Second 800  due', 'you pay', 'you'),
        step('Day 30', 'Final 800  due', 'you pay', 'you')
      ],
      chest: [
        { text: '− 800 ', when: 'taken today', style: 'font-family: "IBM Plex Mono", monospace; color: #8E2C1C; font-weight: 600' },
        { text: '+ 200 Falernian Wine', when: 'arrives day 12', style: 'font-family: "IBM Plex Mono", monospace; color: #2C5F50; font-weight: 600' },
        { text: '− 1,600 ', when: 'days 12 and 30', style: 'font-family: "IBM Plex Mono", monospace; color: #8E2C1C; font-weight: 600' }
      ]
    };
  }
}

</script>
<script>DC.boot(Component);</script>
</body>
</html>

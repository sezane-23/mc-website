<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markets — what you've heard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Spectral:wght@400;500;600&amp;family=IM+Fell+English&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#171B1C}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.4), 0 6px 12px rgba(0,0,0,0.35), 0 22px 44px rgba(0,0,0,0.5)}
.slate{background-color:#2A3032;background-image:radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 55%), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%), url(assets/e96f316ec4bcf032a279eca079e5e2ac.jpg);background-size:auto, auto, cover;background-position:center}
.kicker{font-family:Cinzel,serif;font-size:13px;font-weight:700;letter-spacing:0.14em;color:#3A2516}
.chalk{font-family:Cinzel,serif;font-weight:700;letter-spacing:0.16em;color:#E6E8E2;text-shadow:0 0 1px rgba(255,255,255,0.4)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ping{0%{r:10;opacity:0.7}100%{r:30;opacity:0}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #171B1C; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">AQUEA · LATE AUTUMN · 3 WEEKS UNTIL THE SEA CLOSES</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><a href="#" style="{{n.style}}">{{n.label}}</a></sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<!-- YOUR PERSON READS THIS PAGE FOR YOU -->
<section aria-label="Summary" style="display: grid; grid-template-columns: 1fr 360px; gap: 22px; padding: 16px 20px; background: #EFE3C8; color: #2A2119; border-radius: 3px; box-shadow: 0 14px 30px rgba(0,0,0,0.45); border-left: 6px solid #9A6A12">
<div style="display: flex; gap: 16px; align-items: flex-start">
<img src="{{aide.face}}" alt="" style="flex: none; width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 3px #F6EAD0, 0 4px 10px rgba(0,0,0,0.3)">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #7E2A1A">{{aide.head}}</span>
<sc-for list="{{aide.says}}" as="ai" hint-placeholder-count="3"><span style="{{ai.style}}">{{ai.t}}</span></sc-for>
<span style="font-size: 13px; color: #6B5A48">{{aide.foot}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-left: 20px; border-left: 1px solid rgba(58,37,22,0.2)">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6B5A48">{{aide.askLabel}}</span>
<div role="radiogroup" aria-label="{{aide.askLabel}}" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px">
<sc-for list="{{aide.levels}}" as="al" hint-placeholder-count="3"><button role="radio" aria-checked="{{al.on}}" onClick="{{al.click}}" style="{{al.style}}">{{al.label}}</button></sc-for>
</div>
<span style="font-size: 14px; line-height: 1.4; color: #1F1710">{{aide.will}}</span>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #B9C7C9">WHAT YOU'VE HEARD</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">Markets</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><span style="{{c.style}}">{{c.text}}</span></sc-for>
</div>
</div>

<div style="overflow-x: auto">
<div class="slate" style="width: 1376px; box-sizing: border-box; padding: 28px 30px 38px; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 2px #3A4244; display: flex; flex-direction: column; gap: 24px">

<!-- goods -->
<div role="tablist" aria-label="Goods" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{goods}}" as="g" hint-placeholder-count="6"><button role="tab" onClick="{{g.click}}" style="{{g.style}}"><span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700">{{g.name}}</span><span style="font-size: 12px; opacity: 0.8">{{g.sub}}</span></button></sc-for>
</div>

<div style="display: grid; grid-template-columns: 1fr 520px; gap: 24px; align-items: start">
<!-- the knowledge book -->
<div class="paper" style="padding: 22px 24px; color: #2A2119; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><span class="kicker">{{book.title}}</span><span style="font-size: 13px; color: #6B5A48">{{book.note}}</span></div>
<div style="display: grid; grid-template-columns: 110px 136px 1fr 110px 110px; gap: 10px; padding: 6px 0; border-bottom: 2px solid rgba(58,37,22,0.35); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #6B5A48">
<span>TOWN</span><span>PRICE</span><span>WHO SAYS SO, AND WHEN</span><span>HOW SURE</span><span>STOCKS THERE</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="{{r.rowStyle}}">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; color: #2A1A0E">{{r.town}}</span>
<span style="display: flex; flex-direction: column"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; color: #1F1710">{{r.price}}</span><span style="{{r.vsStyle}}">{{r.vs}}</span></span>
<span style="display: flex; gap: 8px; align-items: center; min-width: 0"><img src="{{r.face}}" alt="" style="{{r.faceStyle}}"><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; color: #1F1710">{{r.source}}</span><span style="font-size: 12px; color: #6B5A48">{{r.age}}</span></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="{{r.sureStyle}}">{{r.dots}}</span><span style="font-size: 12px; color: #6B5A48">{{r.sure}}</span></span>
<span style="display: flex; flex-direction: column; gap: 3px"><span style="display: block; height: 7px; border-radius: 4px; background: rgba(58,37,22,0.15)"><span style="{{r.stockBar}}"></span></span><span style="font-size: 12px; color: #3A2516">{{r.stock}}</span></span>
</div>
</sc-for>
<div style="{{deal.style}}">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em">{{deal.kicker}}</span>
<span style="font-size: 16px; line-height: 1.45">{{deal.text}}</span>
<span style="font-size: 13px; opacity: 0.85">{{deal.caveat}}</span>
</div>
</div>

<!-- the price map -->
<div class="paper" style="padding: 16px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(0.4deg)">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span class="kicker">{{mapTitle}}</span><span style="font-size: 12px; color: #6B5A48">faded = old news</span></div>
<svg width="488" height="305" viewBox="60 140 1500 940" role="img" aria-label="{{mapAria}}" style="display: block; box-shadow: 0 0 0 1px rgba(58,37,22,0.3)">
<image href="assets/9f5158a39938dfbadce3acb1871c8938.jpg" x="0" y="0" width="1600" height="1000"></image>
<rect x="0" y="0" width="1600" height="1000" style="fill: rgba(246,236,212,0.25)"></rect>
<sc-for list="{{moves}}" as="mv" hint-placeholder-count="3"><path d="{{mv.d}}" style="{{mv.style}}"></path></sc-for>
<sc-for list="{{dots}}" as="d" hint-placeholder-count="7">
<g style="{{d.g}}">
<circle cx="{{d.x}}" cy="{{d.y}}" r="{{d.r}}" style="{{d.fill}}"></circle>
<text x="{{d.x}}" y="{{d.ty}}" style="font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; fill: #1F1710; text-anchor: middle; paint-order: stroke; stroke: rgba(246,236,212,0.95); stroke-width: 6px">{{d.label}}</text>
<text x="{{d.x}}" y="{{d.ny}}" style="font-family: 'IM Fell English', serif; font-size: 26px; fill: #3A2516; text-anchor: middle; paint-order: stroke; stroke: rgba(246,236,212,0.9); stroke-width: 5px">{{d.name}}</text>
</g>
</sc-for>
</svg>
<div style="display: flex; gap: 14px; font-size: 12px; color: #3A2516; flex-wrap: wrap">
<span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #3E8A5A; margin-right: 4px"></span>cheap</span>
<span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #C9962A; margin-right: 4px"></span>usual</span>
<span><span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #B23A24; margin-right: 4px"></span>dear</span>
<span>bigger circle = fuller stores</span>
<span>dashed = goods on the move</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 22px">
<!-- on the move -->
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(-0.4deg)">
<span class="kicker">ON THE MOVE</span>
<sc-for list="{{transit}}" as="t" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<span style="{{t.iconStyle}}">{{t.icon}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; color: #1F1710">{{t.text}}</span><span style="font-size: 13px; color: #6B5A48">{{t.meta}}</span><span style="{{t.effectStyle}}">{{t.effect}}</span></span>
</div>
</sc-for>
</div>
<!-- rival houses -->
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(0.3deg)">
<span class="kicker">WHAT THE OTHER HOUSES ARE DOING</span>
<sc-for list="{{rivals}}" as="rv" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<img src="{{rv.face}}" alt="" style="width: 40px; height: 40px; image-rendering: pixelated; box-shadow: 0 0 0 2px #F6EAD0, 0 2px 4px rgba(0,0,0,0.3)">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{rv.name}} <span style="{{rv.moodStyle}}">{{rv.mood}}</span></span><span style="font-size: 14px; color: #1F1710">{{rv.text}}</span><span style="font-size: 12px; color: #6B5A48">{{rv.meta}}</span></span>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 22px">
<!-- rumours -->
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 10px; transform: rotate(0.4deg); border-top: 4px solid #9A6A12">
<span class="kicker">RUMOURS YOU CAN’T CONFIRM</span>
<sc-for list="{{rumours}}" as="ru" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<span style="font-family: 'IM Fell English', serif; font-size: 17px; line-height: 1.4; color: #1F1710">{{ru.text}}</span>
<span style="font-size: 13px; color: #6B5A48">{{ru.meta}}</span>
<sc-if value="{{ru.open}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ru.acts}}" as="a" hint-placeholder-count="3"><button onClick="{{a.click}}" style="min-height: 38px; padding: 4px 12px; background: rgba(255,250,238,0.6); border: 1px solid rgba(58,37,22,0.35); border-radius: 3px; font-family: Spectral, serif; font-size: 13px; cursor: pointer">{{a.label}}</button></sc-for></div></sc-if>
<sc-if value="{{ru.done}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #1F3A30; padding: 6px 10px; background: rgba(44,95,80,0.1); border-left: 3px solid #2C5F50; animation: fadein 0.4s ease-out both">{{ru.outcome}}</span></sc-if>
</div>
</sc-for>
</div>
<!-- spies -->
<div style="padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; background: #2E2824; color: #E8DCC4; box-shadow: 0 10px 24px rgba(0,0,0,0.5); border: 1px solid rgba(232,220,196,0.2); transform: rotate(-0.3deg)">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #E6B8A8">SPIES AND OTHER PEOPLE’S LETTERS</span>
<div style="display: flex; gap: 10px; align-items: center"><img src="assets/a6d6538e5b5bc088097dd36f4020019c.png" alt="" style="width: 34px; height: 34px; image-rendering: pixelated; box-shadow: 0 0 0 2px #3A3026; filter: brightness(0.9)"><span style="font-size: 14px; line-height: 1.4">Your spy, a kitchen girl in Fulvius’s house: <span style="font-family: 'IM Fell English', serif; font-size: 16px">“He means to hold the salt until the sea opens in spring, then sell it in Aquea at double.”</span></span></div>
<div style="padding: 12px 14px; background: #EFE3C8; color: #2A2119; transform: rotate(0.6deg); box-shadow: 0 6px 14px rgba(0,0,0,0.4)">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #8E2418">INTERCEPTED AT THE CORIA HARBOUR · FULVIUS TO HIS AGENT</span>
<p style="margin: 4px 0 0; font-family: 'IM Fell English', serif; font-size: 16px; line-height: 1.45">“Buy all the grain you can in Coria before the news from Melulona arrives. Pay up to 0.50. Tell no one.”</p>
</div>
<sc-if value="{{letter.open}}" hint-placeholder-val="{{ true }}"><div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px"><sc-for list="{{letter.acts}}" as="a" hint-placeholder-count="3"><button onClick="{{a.click}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 58px; padding: 6px 10px; background: rgba(255,255,255,0.05); color: #E8DCC4; border: 1px solid rgba(232,220,196,0.3); border-radius: 3px; font-family: Spectral, serif; text-align: left; cursor: pointer"><span style="font-size: 14px; font-weight: 600">{{a.label}}</span><span style="font-size: 12px; color: #C9BBA0">{{a.hint}}</span></button></sc-for></div></sc-if>
<sc-if value="{{letter.done}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; padding: 8px 10px; background: rgba(255,255,255,0.06); border-left: 3px solid #E6B8A8; animation: fadein 0.4s ease-out both">{{letter.outcome}}</span></sc-if>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(232,220,196,0.18)">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #E6B8A8">PLANT A RUMOUR OF YOUR OWN</span>
<span style="font-size: 14px">{{plant.text}}</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{plant.opts}}" as="p" hint-placeholder-count="3"><button onClick="{{p.click}}" style="{{p.style}}">{{p.label}}</button></sc-for></div>
<span style="font-size: 12px; color: #C9BBA0">{{plant.note}}</span>
</div>
</div>
</div>
</div>

<!-- banks, war, government -->
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; align-items: start">
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(-0.3deg)">
<span class="kicker">THE BANKS</span>
<sc-for list="{{banks}}" as="bk" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 3px; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{bk.name}}</span><span style="{{bk.wordStyle}}">{{bk.word}}</span></span>
<span style="display: block; height: 7px; border-radius: 4px; background: rgba(58,37,22,0.15)"><span style="{{bk.bar}}"></span></span>
<span style="font-size: 13px; color: #3A2516">{{bk.text}}</span>
</div>
</sc-for>
<span style="font-size: 13px; color: #8E2418; padding-top: 6px; border-top: 1px solid rgba(58,37,22,0.15)">{{bankWarn}}</span>
</div>
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(0.4deg); border-top: 4px solid #8E2418">
<span class="kicker">THE WAR, AND WHAT IT EATS</span>
<sc-for list="{{war}}" as="w" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{w.t}}</span><span style="font-size: 14px; color: #3A2516">{{w.d}}</span></div>
</sc-for>
</div>
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(-0.2deg)">
<span class="kicker">WHAT THE RULERS WILL DO</span>
<span style="font-size: 13px; color: #6B5A48; margin-top: -4px">Politics runs without you. This is the forecast.</span>
<sc-for list="{{gov}}" as="gv" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6B5A48">{{gv.where}}</span><span style="{{gv.oddsStyle}}">{{gv.odds}}</span></span>
<span style="font-size: 15px; color: #1F1710">{{gv.t}}</span>
<span style="font-size: 13px; color: #2E5878">{{gv.d}}</span>
</div>
</sc-for>
</div>
</div>

</div>
</div>
</main>
</div>
</template>
<script src="dc-runtime.js"></script>
<script>

var FACE = {

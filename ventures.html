<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventures — the forum wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&amp;family=Spectral:wght@400;500;600&amp;family=IM+Fell+English&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#1E1B17}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.25), 0 5px 10px rgba(40,30,20,0.25), 0 16px 30px rgba(40,30,20,0.3)}
.wall{background-color:#D6CDBB;background-image:radial-gradient(ellipse at 50% 30%, rgba(255,248,230,0.25) 0%, rgba(0,0,0,0) 55%), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 50%, rgba(40,30,20,0.35) 100%), url(assets/c51c1402ee70b728739a9e560f5bffc7.jpg);background-size:auto, auto, cover;background-position:center}
.kicker{font-family:Cinzel,serif;font-size:13px;font-weight:700;letter-spacing:0.14em;color:#3A2516}
.painted{font-family:Cinzel,serif;font-weight:900;letter-spacing:0.12em;color:rgba(142,38,24,0.88);text-shadow:0 0 1px rgba(142,38,24,0.4)}
.alleyst{background-color:#141418;background-image:radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5) 100%), url(assets/b635a9d2bcc8cf72cd66d2ffeff0f4b8.jpg);background-size:auto, cover;background-position:center}
.dark{background:rgba(16,14,13,0.84);border:1px solid rgba(232,220,196,0.18);box-shadow:0 10px 26px rgba(0,0,0,0.55)}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.nail{position:absolute;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #8A8580 0%, #3E3A36 55%, #1E1C1A 100%);box-shadow:1px 2px 2px rgba(0,0,0,0.5)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #1E1B17; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">AQUEA · THE FORUM</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><a href="#" style="{{n.style}}">{{n.label}}</a></sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<!-- YOUR PERSON READS THIS PAGE FOR YOU -->
<section aria-label="Summary" style="display: grid; grid-template-columns: 1fr 360px; gap: 22px; padding: 16px 20px; background: #EFE3C8; color: #2A2119; border-radius: 3px; box-shadow: 0 14px 30px rgba(0,0,0,0.45); border-left: 6px solid #9A6A12">
<div style="display: flex; gap: 16px; align-items: flex-start">
<img src="{{aide.face}}" alt="" style="flex: none; width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 3px #F6EAD0, 0 4px 10px rgba(0,0,0,0.3)">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #7E2A1A">{{aide.head}}</span>
<sc-for list="{{aide.says}}" as="ai" hint-placeholder-count="3"><span style="{{ai.style}}">{{ai.t}}</span></sc-for>
<span style="font-size: 13px; color: #6B5A48">{{aide.foot}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-left: 20px; border-left: 1px solid rgba(58,37,22,0.2)">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6B5A48">{{aide.askLabel}}</span>
<div role="radiogroup" aria-label="{{aide.askLabel}}" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px">
<sc-for list="{{aide.levels}}" as="al" hint-placeholder-count="3"><button role="radio" aria-checked="{{al.on}}" onClick="{{al.click}}" style="{{al.style}}">{{al.label}}</button></sc-for>
</div>
<span style="font-size: 14px; line-height: 1.4; color: #1F1710">{{aide.will}}</span>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #E6B8A8">{{kick}}</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">{{title}}</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><span style="{{c.style}}">{{c.text}}</span></sc-for>
</div>
</div>

<div style="overflow-x: auto">
<sc-if value="{{forum}}" hint-placeholder-val="{{ true }}">
<div class="wall" style="width: 1376px; box-sizing: border-box; padding: 34px 34px 40px; border-radius: 3px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 22px; color: #2A2119">

<div style="display: flex; align-items: baseline; gap: 18px">
<span class="painted" style="font-size: 30px">LOCATIONES</span>
<span style="font-size: 16px; color: #4A3A2A">Public contracts, posted by order of the magistrates of Aquea</span>
<button onClick="{{enterAlley}}" style="margin-left: auto; align-self: center; display: flex; gap: 12px; align-items: center; min-height: 52px; padding: 6px 18px 6px 8px; background: #241E19; color: #E8DCC4; border: 1px solid #0E0B09; border-radius: 3px; box-shadow: 0 8px 18px rgba(0,0,0,0.35); font-family: Spectral, serif; cursor: pointer">
<img src="assets/35739c12084cd018e20520e1a5ec3722.png" alt="" style="width: 36px; height: 36px; image-rendering: pixelated; box-shadow: 0 0 0 2px #3A3026">
<span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-family: Cinzel, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; color: #E6B8A8">THE ALLEY</span><span style="font-size: 14px">Kallias is waiting →</span></span>
</button>
</div>

<div style="display: grid; grid-template-columns: 540px 1fr 1fr; gap: 26px; align-items: start">

<!-- TAX FARMING -->
<div class="paper" style="position: relative; padding: 24px 26px; transform: rotate(-0.5deg); display: flex; flex-direction: column; gap: 12px">
<span class="nail" style="left: 50%; top: 8px; margin-left: -6px"></span>
<span class="kicker" style="color: #8E2418">TAX FARMING · SEALED BIDS</span>
<span style="font-family: Cinzel, serif; font-size: 25px; font-weight: 700; line-height: 1.2; color: #2A1A0E">The taxes of Peruaria, for five years</span>
<span style="font-size: 15px; line-height: 1.45; color: #1F1710">Pay the state up front. Collect the harvest tax from every farm in Peruaria and keep whatever you gather. Good years make fortunes; war and famine ruin men.</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; padding: 10px 0; border-top: 1px solid rgba(58,37,22,0.18); border-bottom: 1px solid rgba(58,37,22,0.18)">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">Collections, per year</span><span style="font-size: 16px; color: #1F1710">9,000 to 14,000 </span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">Lowest bid accepted</span><span style="font-size: 16px; color: #1F1710">38,000 </span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">Bids opened</span><span style="font-size: 16px; color: #1F1710">On the Kalends, in 9 days</span></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">Cost of collecting</span><span style="font-size: 16px; color: #1F1710">About 15% to agents</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #6B5A48">Rumoured rival bids</span>
<sc-for list="{{rivals}}" as="r" hint-placeholder-count="3">
<div style="display: flex; gap: 10px; align-items: center">
<img src="{{r.face}}" alt="" style="width: 28px; height: 28px; image-rendering: pixelated; box-shadow: 0 0 0 2px #F6EAD0, 0 2px 4px rgba(0,0,0,0.3)">
<span style="flex: 1; font-size: 15px; color: #1F1710">{{r.name}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3A2516">{{r.bid}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: rgba(255,250,238,0.5); border: 1px solid rgba(58,37,22,0.25); border-radius: 3px">
<span style="font-size: 14px; color: #6B5A48">Your sealed bid</span>
<div style="display: flex; align-items: center; gap: 10px">
<button onClick="{{bidDown}}" aria-label="Lower bid by 1,000" style="width: 44px; height: 44px; border: 1px solid #5A3A22; background: transparent; border-radius: 3px; font-size: 22px; color: #3A2516; cursor: pointer">−</button>
<span style="flex: 1; text-align: center; font-family: Cinzel, serif; font-size: 30px; font-weight: 700; color: #2A1A0E">{{bidText}}</span>
<button onClick="{{bidUp}}" aria-label="Raise bid by 1,000" style="width: 44px; height: 44px; border: 1px solid #5A3A22; background: transparent; border-radius: 3px; font-size: 22px; color: #3A2516; cursor: pointer">+</button>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #6B5A48">Chance to win</span><span style="color: #1F1710; font-weight: 600">{{winText}}</span></span>
<div style="height: 8px; border-radius: 4px; background: rgba(58,37,22,0.15)"><div style="{{winBar}}"></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #6B5A48">Partners who stand surety with you</span>
<sc-for list="{{partners}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.click}}" style="{{p.style}}">
<span style="{{p.box}}">{{p.mark}}</span>
<span style="flex: 1; display: flex; flex-direction: column; text-align: left"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{p.name}}</span><span style="font-size: 13px; color: #6B5A48">{{p.note}}</span></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3A2516">{{p.share}}</span>
</button>
</sc-for>
<span style="{{suretyStyle}}">{{suretyText}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #6B5A48">{{outcomeTitle}}</span>
<sc-for list="{{outcomes}}" as="o" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 4px 0; border-top: 1px solid rgba(58,37,22,0.1)"><span style="font-size: 15px; color: #1F1710">{{o.k}}</span><span style="{{o.style}}">{{o.v}}</span></div>
</sc-for>
<span style="font-size: 13px; color: #8E2418; padding-top: 4px">Collecting in a foreign land makes enemies. Peruarians will curse the name of the house that taxes them.</span>
</div>

<sc-if value="{{bidOpen}}" hint-placeholder-val="{{ true }}">
<button onClick="{{submitBid}}" style="{{submitStyle}}">{{submitLabel}}</button>
</sc-if>
<sc-if value="{{bidSent}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: rgba(44,95,80,0.12); border-left: 3px solid #2C5F50; animation: fadein 0.4s ease-out both">
<span style="font-size: 15px; font-weight: 600; color: #1F1710">{{sentText}}</span>
<span style="font-size: 14px; color: #3A2516">The magistrate opens the bids on the Kalends. You’ll hear by letter. Until then, Fulvius will try to learn your number.</span>
<button onClick="{{withdraw}}" style="align-self: flex-start; min-height: 32px; padding: 0; border: none; background: transparent; color: #6B5A48; font-family: Spectral, serif; font-size: 13px; text-decoration: underline; cursor: pointer">Withdraw the bid</button>
</div>
</sc-if>
</div>

<!-- ARMY SUPPLY + TEMPLE -->
<sc-for list="{{contracts}}" as="k" hint-placeholder-count="2">
<div class="paper" style="{{k.style}}">
<span class="nail" style="left: 50%; top: 8px; margin-left: -6px"></span>
<span class="kicker" style="color: #8E2418">{{k.kicker}}</span>
<span style="font-family: Cinzel, serif; font-size: 22px; font-weight: 700; line-height: 1.2; color: #2A1A0E">{{k.title}}</span>
<span style="font-size: 15px; line-height: 1.45; color: #1F1710">{{k.text}}</span>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid rgba(58,37,22,0.18); border-bottom: 1px solid rgba(58,37,22,0.18)">
<sc-for list="{{k.terms}}" as="t" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 1fr auto; gap: 10px"><span style="font-size: 14px; color: #6B5A48">{{t.k}}</span><span style="font-size: 15px; color: #1F1710; text-align: right">{{t.v}}</span></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #6B5A48">{{k.meterLabel}}</span>
<div style="height: 10px; border-radius: 5px; background: rgba(58,37,22,0.15); overflow: hidden"><div style="{{k.meter}}"></div></div>
<span style="font-size: 13px; color: #3A2516">{{k.meterNote}}</span>
</div>
<span style="{{k.riskStyle}}">{{k.risk}}</span>
<span style="font-size: 14px; color: #2C5F50">{{k.reward}}</span>
<sc-if value="{{k.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 8px">
<button onClick="{{k.sign}}" style="flex: 1; min-height: 46px; background: #3A2516; color: #FFF6E4; border: none; border-radius: 3px; font-family: Cinzel, serif; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer">Sign the contract</button>
<button onClick="{{k.pass}}" style="min-height: 46px; padding: 6px 16px; background: transparent; color: #2A1A0E; border: 1px solid #5A3A22; border-radius: 3px; font-family: Spectral, serif; font-size: 15px; cursor: pointer">Pass</button>
</div>
</sc-if>
<sc-if value="{{k.decided}}" hint-placeholder-val="{{ false }}">
<div style="{{k.resultStyle}}"><span style="font-size: 15px; color: #1F1710">{{k.result}}</span><button onClick="{{k.undo}}" style="align-self: flex-start; min-height: 30px; padding: 0; border: none; background: transparent; color: #6B5A48; font-family: Spectral, serif; font-size: 13px; text-decoration: underline; cursor: pointer">Change your mind</button></div>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: baseline; gap: 18px; margin-top: 10px">
<span class="painted" style="font-size: 30px">VENALIA</span>
<span style="font-size: 16px; color: #4A3A2A">For sale: land, businesses and shares. Buy one and it moves to your Business screen.</span>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 26px; align-items: start">
<sc-for list="{{sale}}" as="sg" hint-placeholder-count="3">
<div class="paper" style="{{sg.style}}">
<span class="nail" style="left: 50%; top: 10px; margin-left: -6px"></span>
<span class="kicker">{{sg.title}}</span>
<sc-for list="{{sg.items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid rgba(58,37,22,0.14)">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px"><span style="font-size: 16px; font-weight: 600; color: #1F1710">{{it.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3A2516; white-space: nowrap">{{it.price}}</span></span>
<span style="font-size: 14px; line-height: 1.4; color: #4A3A2A">{{it.note}}</span>
<button onClick="{{it.click}}" style="{{it.btn}}">{{it.label}}</button>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start">

<!-- GUILD -->
<div class="paper" style="position: relative; padding: 22px 24px; transform: rotate(-0.3deg); display: flex; flex-direction: column; gap: 10px">
<span class="nail" style="left: 14px; top: 10px"></span><span class="nail" style="right: 14px; top: 10px"></span>
<span class="kicker">COLLEGIUM OF WINE MERCHANTS</span>
<span style="font-size: 15px; line-height: 1.45; color: #1F1710">You’re a member: 50  a month. The guild buries its dead, settles quarrels and speaks for wine merchants to the magistrates.</span>
<div style="padding: 12px 14px; background: rgba(255,250,238,0.55); border: 1px solid rgba(58,37,22,0.25); border-radius: 3px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600; color: #1F1710">Vote at the next meeting: a minimum price for wine in Aquea?</span>
<span style="font-size: 13px; color: #6B5A48">{{guild.note}}</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{guild.votes}}" as="v" hint-placeholder-count="3"><button onClick="{{v.click}}" style="{{v.style}}">{{v.label}}</button></sc-for>
</div>
</div>
</div>

<!-- SMUGGLING NOTE -->
<div style="position: relative; padding: 22px 24px; transform: rotate(1.4deg); display: flex; flex-direction: column; gap: 10px; background: #3B332B; background-image: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2)); color: #E8DCC4; box-shadow: 0 6px 14px rgba(0,0,0,0.35), 0 18px 34px rgba(0,0,0,0.3); clip-path: polygon(0 2%, 8% 0, 22% 1.5%, 40% 0, 63% 1%, 80% 0, 100% 1.5%, 99% 30%, 100% 62%, 98.5% 100%, 70% 98.5%, 45% 100%, 20% 98.5%, 0 100%, 1% 60%)">
<span class="nail" style="left: 50%; top: 10px; margin-left: -6px"></span>
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #E6B8A8">LEFT UNDER YOUR DOOR</span>
<div style="display: flex; gap: 12px; align-items: center">
<img src="assets/35739c12084cd018e20520e1a5ec3722.png" alt="" style="width: 40px; height: 40px; image-rendering: pixelated; box-shadow: 0 0 0 2px #2A231C">
<span style="font-family: 'IM Fell English', serif; font-size: 17px; line-height: 1.4">“I can bring Mirenian purple past the customs men at Sabino. No duty paid. You’d clear 600 more on a cargo. Ask for Kallias at the Red Anchor.”</span>
</div>
<span style="font-size: 14px; color: #C9BBA0">One run in seven gets caught: cargo seized, a fine, and your name in the magistrate’s book.</span>
<span style="font-size: 14px; color: #E8DCC4">Kallias says there’s more where that came from, for a man who can keep his mouth shut.</span>
<button onClick="{{enterAlley}}" style="min-height: 50px; margin-top: 4px; background: #E6B8A8; color: #1E1612; border: none; border-radius: 3px; font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer">Meet him in the alley →</button>
</div>
</div>

</div>
</sc-if>

<sc-if value="{{alley}}" hint-placeholder-val="{{ false }}">

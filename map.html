<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World map — sample continent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Spectral:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#C9CDBE}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#7E2A1A}a:hover{color:#5A1C10}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.35), 0 5px 10px rgba(0,0,0,0.3), 0 20px 40px rgba(0,0,0,0.42) !important}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #C9CDBE; font-family: Spectral, Georgia, serif; color: #2A2119">

<svg width="1440" height="900" role="img" aria-label="Interactive parchment map of a sample continent with five countries, their towns, roads and trade routes" style="{{svgStyle}}" onWheel="{{onWheel}}" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerLeave="{{onUp}}">
<g transform="{{view}}">
<image href="assets/9f5158a39938dfbadce3acb1871c8938.jpg"x="0" y="0" width="1600" height="1000"></image>

<g style="{{layer.countries}}">
<sc-for list="{{countries}}" as="c" hint-placeholder-count="5">
<path d="{{c.d}}" style="{{c.style}}" onMouseEnter="{{c.enter}}" onMouseLeave="{{leave}}"></path>
</sc-for>
</g>

<g style="{{layer.roads}}">
<sc-for list="{{roads}}" as="r" hint-placeholder-count="60">
<path d="{{r.d}}" style="{{r.style}}"></path>
</sc-for>
</g>

<g>
<sc-for list="{{trade}}" as="t" hint-placeholder-count="5">
<path d="{{t.d}}" style="{{t.style}}"></path>
<path d="{{t.d}}" style="{{t.hitStyle}}" onMouseEnter="{{t.enter}}" onMouseLeave="{{leave}}"></path>
</sc-for>
</g>

<g style="{{layer.countryLabels}}">
<sc-for list="{{countries}}" as="c" hint-placeholder-count="5">
<text x="{{c.lx}}" y="{{c.ly}}" style="{{c.labelStyle}}">{{c.upper}}</text>
</sc-for>
</g>

<sc-for list="{{places}}" as="p" hint-placeholder-count="72">
<g transform="{{p.tf}}" style="cursor: pointer" onMouseEnter="{{p.enter}}" onMouseLeave="{{leave}}" onClick="{{p.pin}}">
<circle r="{{p.hitR}}" style="fill: transparent"></circle>
<circle r="{{p.ringR}}" style="{{p.ringStyle}}"></circle>
<circle r="{{p.r}}" style="{{p.dotStyle}}"></circle>
<text x="{{p.tx}}" y="{{p.ty}}" style="{{p.labelStyle}}">{{p.name}}</text>
</g>
</sc-for>
</g>
</svg>

<!-- TITLE CARTOUCHE -->
<div class="paper" style="position: absolute; left: 28px; top: 28px; width: 330px; padding: 16px 20px; box-shadow: 0 10px 24px rgba(40,28,16,0.35); display: flex; flex-direction: column; gap: 4px; pointer-events: none">
<span style="font-family: Cinzel, serif; font-size: 22px; font-weight: 700; letter-spacing: 0.08em; color: #3A2516">THE CONTINENT</span>
<span style="font-size: 14px; color: #4A3C30">A made-up sample world: five countries, 72 settlements. Your real map will be drawn from your seed picture.</span>
<span style="font-size: 13px; color: #6B5A48; padding-top: 4px; border-top: 1px solid rgba(90,58,34,0.25)">Drag to move · zoom in to see cities, then towns, then villages · hover a town to see its trade routes · click to pin it</span>
</div>

<!-- CONTROLS -->
<div style="position: absolute; right: 28px; top: 28px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
<div class="paper" style="display: flex; flex-direction: column; box-shadow: 0 8px 18px rgba(40,28,16,0.35)">
<button aria-label="Zoom in" onClick="{{zoomIn}}" style="width: 44px; height: 44px; border: none; border-bottom: 1px solid rgba(90,58,34,0.3); background: transparent; font-family: Cinzel, serif; font-size: 22px; color: #3A2516; cursor: pointer">+</button>
<button aria-label="Zoom out" onClick="{{zoomOut}}" style="width: 44px; height: 44px; border: none; border-bottom: 1px solid rgba(90,58,34,0.3); background: transparent; font-family: Cinzel, serif; font-size: 22px; color: #3A2516; cursor: pointer">−</button>
<button aria-label="Show the whole map" onClick="{{reset}}" style="width: 44px; height: 44px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#3A2516" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
</button>
</div>
<div class="paper" style="padding: 10px 12px; box-shadow: 0 8px 18px rgba(40,28,16,0.35); display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #5A3A22">SHOW</span>
<sc-for list="{{toggles}}" as="tg" hint-placeholder-count="4">
<button onClick="{{tg.flip}}" style="{{tg.style}}"><span style="{{tg.box}}"></span>{{tg.label}}</button>
</sc-for>
</div>
</div>

<!-- LEGEND -->
<div class="paper" style="position: absolute; left: 28px; bottom: 28px; padding: 12px 16px; box-shadow: 0 8px 18px rgba(40,28,16,0.35); display: grid; grid-template-columns: repeat(2, minmax(0, auto)); gap: 6px 22px; font-size: 14px; pointer-events: none">
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" style="fill: none; stroke: #7E2A1A; stroke-width: 1.5px"></circle><circle cx="9" cy="9" r="4.5" style="fill: #7E2A1A; stroke: #F3E9D2; stroke-width: 1.2px"></circle></svg>Capital</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="26" height="10" aria-hidden="true"><path d="M1 5 H25" style="stroke: #5A3E26; stroke-width: 1.6px; stroke-dasharray: 6 4"></path></svg>Road</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="4.5" style="fill: #3A2516; stroke: #F3E9D2; stroke-width: 1.2px"></circle></svg>City</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="26" height="10" aria-hidden="true"><path d="M1 5 H25" style="stroke: #5A3E26; stroke-width: 1.1px; stroke-dasharray: 2 4; opacity: 0.7"></path></svg>Track</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="3.2" style="fill: #3A2516; stroke: #F3E9D2; stroke-width: 1px"></circle></svg>Town</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="26" height="10" aria-hidden="true"><path d="M2 5 H25" style="stroke: #2E4E60; stroke-width: 2px; stroke-dasharray: 1 6; stroke-linecap: round"></path></svg>Sea lane</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="2.4" style="fill: #F3E9D2; stroke: #3A2516; stroke-width: 1.2px"></circle></svg>Village</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="26" height="10" aria-hidden="true"><path d="M1 5 H25" style="stroke: #7A1E3A; stroke-width: 3px; stroke-dasharray: 10 5"></path></svg>Trade route</span>
</div>

<!-- HOVER CARD -->
<sc-if value="{{hasTip}}" hint-placeholder-val="{{ false }}">
<div class="paper" style="{{tip.style}}">
<div style="{{tip.bar}}"></div>
<span style="font-family: Cinzel, serif; font-size: 17px; font-weight: 700; letter-spacing: 0.04em; color: #2A1A0E">{{tip.title}}</span>
<span style="font-size: 14px; color: #5E5042; margin-top: -2px">{{tip.sub}}</span>
<div style="display: flex; flex-direction: column; gap: 3px; padding-top: 6px; border-top: 1px solid rgba(90,58,34,0.25)">
<sc-for list="{{tip.rows}}" as="row" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 14px; font-size: 14px"><span style="color: #6B5A48">{{row.k}}</span><span style="color: #1F1710; text-align: right">{{row.v}}</span></div>
</sc-for>
</div>
</div>
</sc-if>

<!-- PINNED TOWN -->
<sc-if value="{{hasPin}}" hint-placeholder-val="{{ false }}">
<div class="paper" style="position: absolute; right: 28px; bottom: 28px; width: 300px; padding: 16px 18px; box-shadow: 0 14px 30px rgba(40,28,16,0.45); display: flex; flex-direction: column; gap: 6px">
<div style="{{pin.bar}}"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 20px; font-weight: 700; color: #2A1A0E">{{pin.title}}</span>
<button aria-label="Close" onClick="{{unpin}}" style="width: 44px; height: 44px; margin: -10px -10px -10px 0; border: none; background: transparent; font-size: 22px; color: #5E5042; cursor: pointer">×</button>
</div>
<span style="font-size: 14px; color: #5E5042; margin-top: -6px">{{pin.sub}}</span>
<div style="display: flex; flex-direction: column; gap: 3px; padding-top: 6px; border-top: 1px solid rgba(90,58,34,0.25)">
<sc-for list="{{pin.rows}}" as="row" hint-placeholder-count="4">
<div style="display: flex; justify-content: space-between; gap: 14px; font-size: 15px"><span style="color: #6B5A48">{{row.k}}</span><span style="color: #1F1710; text-align: right">{{row.v}}</span></div>
</sc-for>
</div>
<div style="display: flex; gap: 8px; padding-top: 6px">
<button style="flex: 1; min-height: 44px; background: #5A3A22; color: #FFF6E4; border: none; border-radius: 2px; font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer">Visit the market</button>
<button style="flex: 1; min-height: 44px; background: transparent; color: #3A2516; border: 1px solid #5A3A22; border-radius: 2px; font-family: Spectral, serif; font-size: 15px; cursor: pointer">Send a letter</button>
</div>
</div>
</sc-if>

</div>
</template>

        labelStyle: (showLabel ? '' : 'display: none; ') + 'font-family: ' + (p.tier === 'village' ? 'Spectral, serif' : 'Cinzel, serif') + '; font-weight: ' + (p.tier === 'capital' || p.tier === 'city' ? 700 : 500) + '; font-size: ' + fs + 'px; fill: ' + (hot ? '#7E2A1A' : '#2A1A0E') + '; paint-order: stroke; stroke: #F3E9D2; stroke-width: ' + (3.2 / shrink) + 'px; stroke-linejoin: round; pointer-events: none',
        enter: function (e) { var q = self.local(e); self.setState({ hover: { type: 'place', id: p.id }, px: q.x, py: q.y }); },
        pin: function () { self.setState({ pin: p.id }); }
      };
    });

    var tierName = { capital: 'Capital', city: 'City', town: 'Town', village: 'Village' };
    var placeCard = function (p) {
      var c = countryOf(p.country);
      var rows = [
        { k: 'Country', v: c.name },
        { k: 'People', v: 'about ' + fmt(p.pop) },
        { k: 'Produces', v: p.produces.join(', ') },
        { k: 'Wants', v: p.needs.join(', ') }
      ];
      if (p.port) rows.push({ k: 'Harbour', v: 'yes, ships call here' });
      return { title: p.name, sub: tierName[p.tier] + (p.tier === 'capital' ? ' of ' + c.name : ''), rows: rows, color: c.color };
    };
    var tipData = null;
    if (hover) {
      if (hover.type === 'place') tipData = placeCard(D.places[hover.id]);
      if (hover.type === 'country') {
        var c = D.countries[hover.id];
        tipData = { title: c.name, sub: cap(c.character), color: c.color, rows: [
          { k: 'Ruled by', v: c.ruler }, { k: 'Capital', v: c.capital }, { k: 'Settlements', v: String(c.towns) }] };
      }
      if (hover.type === 'route') {
        var t = D.trade[hover.id];
        tipData = { title: t.name, sub: cap(t.goods) + ' from ' + t.from + ' to ' + t.to, color: t.color, rows: [
          { k: 'Carries', v: t.goods }, { k: 'Journey', v: 'about ' + t.days + ' days, by ' + t.via }] };
      }
    }
    var px = s.px || 0, py = s.py || 0;
    var tip = { title: '', sub: '', rows: [], style: 'display: none', bar: '' };
    if (tipData) {
      var left = px + 18, top = py + 18;
      if (left > 1440 - 320) left = px - 318;
      if (top > 900 - 220) top = py - 200;
      tip = {
        title: tipData.title, sub: tipData.sub, rows: tipData.rows,
        style: 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: 300px; box-sizing: border-box; padding: 12px 16px 14px; box-shadow: 0 12px 26px rgba(40,28,16,0.45); display: flex; flex-direction: column; gap: 4px; pointer-events: none; overflow: hidden',
        bar: 'height: 5px; margin: -12px -16px 6px; background: ' + tipData.color
      };
    }
    var pin = { title: '', sub: '', rows: [], bar: '' };
    if (pinId !== null) {
      var pc = placeCard(D.places[pinId]);
      pin = { title: pc.title, sub: pc.sub, rows: pc.rows, bar: 'height: 5px; margin: -16px -18px 8px; background: ' + pc.color };
    }

    var toggleDefs = [['countries', 'Countries'], ['trade', 'All trade routes'], ['roads', 'Roads & sea lanes'], ['labels', 'Town names']];
    var toggles = toggleDefs.map(function (td) {
      var on = layers[td[0]];
      return {
        label: td[1],
        style: 'display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 2px 4px; border: none; background: transparent; font-family: Spectral, serif; font-size: 15px; color: #2A1A0E; cursor: pointer; text-align: left',
        box: 'width: 14px; height: 14px; border: 1.5px solid #5A3A22; border-radius: 2px; background: ' + (on ? '#5A3A22' : 'transparent') + '; box-shadow: inset 0 0 0 2px #EFE3C8',
        flip: function () { var nl = Object.assign({}, layers); nl[td[0]] = !on; self.setState({ layers: nl }); }
      };
    });
    var show = function (b) { return b ? '' : 'display: none'; };

    return {
      view: 'translate(' + v.tx + ' ' + v.ty + ') scale(' + k + ')',
      svgStyle: 'display: block; touch-action: none; cursor: ' + (s.dragging ? 'grabbing' : 'grab'),
      layer: { countries: show(layers.countries), countryLabels: show(layers.countries && layers.labels), trade: show(layers.trade), roads: show(layers.roads) },
      countries: countries, roads: roads, trade: trade, places: places,
      toggles: toggles, leave: leave,
      hasTip: !!tipData && !s.dragging, tip: tip,
      hasPin: pinId !== null, pin: pin,
      unpin: function () { self.setState({ pin: null }); },
      zoomIn: function () { self.zoomAt(1.4, 720, 450); },
      zoomOut: function () { self.zoomAt(1 / 1.4, 720, 450); },
      reset: function () { self.setState({ k: 0.9, tx: 0, ty: 0 }); },
      onWheel: function (e) {
        var p = self.local(e);
        self.zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, p.x, p.y);
      },
      onDown: function (e) {
        var p = self.local(e); var vv = self.view();
        self.drag = { x: p.x, y: p.y, tx: vv.tx, ty: vv.ty, active: false, id: e.pointerId, el: e.currentTarget };
      },
      onMove: function (e) {
        var p = self.local(e);
        var d = self.drag;
        if (d) {
          var dx = p.x - d.x, dy = p.y - d.y;
          if (!d.active && dx * dx + dy * dy > 25) {
            d.active = true;
            try { d.el.setPointerCapture(d.id); } catch (err) {}
          }
          if (d.active) {
            var vv = self.view();
            var nv = self.clampView(vv.k, d.tx + dx, d.ty + dy);
            nv.dragging = true; nv.px = p.x; nv.py = p.y;
            self.setState(nv);
            return;
          }
        }
        if (self.state && self.state.hover) self.setState({ px: p.x, py: p.y });
      },
      onUp: function (e) {
        var d = self.drag;
        self.drag = null;
        if (d && d.active) {
          try { d.el.releasePointerCapture(d.id); } catch (err) {}
          self.setState({ dragging: false });
        }
      }
    };
  }
}

</script>
<script>DC.boot(Component);</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business — the counting desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Spectral:wght@400;500;600&amp;family=IM+Fell+English&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#1A110A}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#F3D27E}a:hover{color:#FFF0C0}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.35), 0 5px 10px rgba(0,0,0,0.3), 0 20px 40px rgba(0,0,0,0.42) !important}
.wood{background-color:#4A3220;background-image:url(assets/f8781ae71473f5b064757900db65402c.jpg);background-size:512px 512px}
.leaf{background-color:#F1E5C8;background-image:radial-gradient(ellipse at 60% 40%, rgba(255,250,232,0.6) 0%, rgba(0,0,0,0) 70%), radial-gradient(ellipse at 20% 80%, rgba(170,130,80,0.10) 0%, rgba(0,0,0,0) 50%)}
.inked{color:#E2C28E;text-shadow:0 -1px 0 rgba(0,0,0,0.7), 0 1px 0 rgba(255,214,150,0.18)}
@keyframes turnNextA{0%{transform:rotateY(0deg);opacity:1}96%{transform:rotateY(-180deg);opacity:1}100%{transform:rotateY(-180deg);opacity:0}}
@keyframes turnNextB{0%{transform:rotateY(0deg);opacity:1}96%{transform:rotateY(-180deg);opacity:1}100%{transform:rotateY(-180deg);opacity:0}}
@keyframes turnPrevA{0%{transform:rotateY(0deg);opacity:1}96%{transform:rotateY(180deg);opacity:1}100%{transform:rotateY(180deg);opacity:0}}
@keyframes turnPrevB{0%{transform:rotateY(0deg);opacity:1}96%{transform:rotateY(180deg);opacity:1}100%{transform:rotateY(180deg);opacity:0}}
@keyframes glint{0%{background-position:130% 0}14%{background-position:-30% 0}100%{background-position:-30% 0}}
@keyframes sparkle{0%,6%{transform:scale(0) rotate(0deg);opacity:0}10%{transform:scale(1) rotate(45deg);opacity:1}15%,100%{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes lateA{0%,55%{opacity:0}100%{opacity:1}}
@keyframes lateB{0%,55%{opacity:0}100%{opacity:1}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #1A110A; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<!-- TOP BAR -->
<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">AQUEA · IDES OF OCTOBER · MORNING</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="{{n.style}}">{{n.label}}</a>
</sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #C9A86A">YOUR BUSINESSES</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">The counting desk</h1>
</div>
<p style="margin: 0; max-width: 520px; font-size: 16px; color: #E6D8BC">Your managers run things. You read the books, press your seal on what matters, and watch who is circling. Turn the ledger's pages, or click a pile of coins.</p>
</div>

<div style="overflow-x: auto">
<div class="wood" style="position: relative; width: 1376px; height: 1110px; overflow: hidden; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 2px #3A2616">
<div style="position: absolute; inset: 22px; border-radius: 3px; background-color: #14281E; background-image: url(assets/7b4f0533033bead1efc1d91d2b56b8ae.jpg); background-size: 700px 700px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.35), 0 1px 0 rgba(255,220,170,0.15)"></div>
<div style="position: absolute; inset: 36px; border: 1.5px solid rgba(201,162,92,0.5); border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 3px rgba(0,0,0,0), inset 0 0 0 4px rgba(201,162,92,0.12)"></div>
<div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 45% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.3) 100%)"></div>

<!-- COIN PILES -->
<div style="position: absolute; left: 44px; top: 22px; width: 900px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #F6E7C4; text-shadow: 0 1px 2px rgba(0,0,0,0.6)">THIS SEASON'S TAKINGS, YOUR CUT</span>
<div style="display: flex; align-items: flex-end; gap: 22px">
<sc-for list="{{stacks}}" as="st" hint-placeholder-count="6">
<button onClick="{{st.pick}}" aria-label="{{st.aria}}" style="{{st.btn}}">
<div style="position: relative; width: 124px; height: 168px">
<div style="position: absolute; left: 8px; bottom: 0; width: 110px; height: 22px; border-radius: 50%; background: rgba(0,0,0,0.45); filter: blur(5px)"></div>
<sc-for list="{{st.coins}}" as="cn" hint-placeholder-count="8">
<img src="{{cn.src}}" alt="" style="{{cn.style}}">
</sc-for>
<div aria-hidden="true" style="{{st.glint}}"></div>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18" style="{{st.spark}}"><path d="M9 0 L10.4 7.6 L18 9 L10.4 10.4 L9 18 L7.6 10.4 L0 9 L7.6 7.6 Z" style="fill: #FFF4D6"></path></svg>
</div>
<span class="paper" style="{{st.tag}}">{{st.label}}<span style="display: block; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #2C5F50">{{st.amount}}</span></span>
</button>
</sc-for>
</div>
</div>

<!-- THE LEDGER -->
<div style="position: absolute; left: 28px; top: 290px; width: 940px; height: 800px; perspective: 2400px">
<img src="assets/f1bdf203460222963da7bbc04186b16e.png" alt="" style="position: absolute; left: 0; top: 0; width: 940px; height: 800px">

<!-- index tabs on the fore-edge of the pages -->
<div style="position: absolute; left: 900px; top: 110px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button onClick="{{tb.go}}" aria-label="{{tb.aria}}" style="{{tb.style}}"><span style="writing-mode: vertical-rl">{{tb.label}}</span></button>
</sc-for>
</div>

<!-- LEFT PAGE -->
<div style="{{lp.style}}">
<sc-if value="{{sp.p0}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; height: 100%">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-family: Cinzel, serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: #3A2516">THE BOOKS</span>
<span style="font-size: 16px; color: #6B5A48">autumn</span>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 40px 52px 52px 58px; gap: 0 6px; font-size: 12px; color: #6B5A48; border-bottom: 1px solid rgba(58,37,22,0.5); padding-bottom: 4px">
<span>Business</span><span style="text-align: right">Yours</span><span style="text-align: right">In</span><span style="text-align: right">Out</span><span style="text-align: right">Your cut</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<button onClick="{{r.pick}}" style="{{r.style}}">
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 17px; line-height: 1.2; color: #1F1710">{{r.name}}</span><span style="font-size: 13px; color: #6B5A48">{{r.kind}}</span></span>
<span style="text-align: right; font-size: 15px; color: #3A2516">{{r.share}}</span>
<span style="text-align: right; font-size: 15px; color: #3A2516">{{r.inc}}</span>
<span style="text-align: right; font-size: 15px; color: #3A2516">{{r.out}}</span>
<span style="text-align: right; font-size: 16px; font-weight: 700; color: #2C5F50">{{r.kept}}</span>
</button>
</sc-for>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 8px 6px 0; border-top: 1px solid rgba(58,37,22,0.5)">
<span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: #3A2516">SUMMA</span>
<span style="font-size: 19px; font-weight: 700; color: #2C5F50">{{total}}</span>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.45; color: #3A2516">
<span>Six businesses in three countries. The further a business lies from you, the more its manager is tempted.</span>
<span style="color: #8E2C1C">Tax to the crown this season: 540 . Gifts to officials: 120 .</span>
</div>
</div>
</sc-if>

<sc-if value="{{sp.p1}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px; height: 100%">
<span style="font-family: Cinzel, serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: #3A2516">DEBTS AND CREDIT</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #8E2C1C">WHAT YOU OWE</span>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(58,37,22,0.12)">
<div style="display: flex; flex-direction: column"><span style="font-size: 17px; color: #1F1710">Sextus Octavius, your banker</span><span style="font-size: 14px; color: #6B5A48">Secured on Varenia. 250 due in 9 days.</span></div>
<span style="font-size: 18px; color: #8E2C1C">3,000</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #2C5F50">WHAT YOU ARE OWED</span>
<sc-for list="{{owed}}" as="o" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(58,37,22,0.12)">
<div style="display: flex; flex-direction: column"><span style="font-size: 17px; color: #1F1710">{{o.who}}</span><span style="font-size: 14px; color: #6B5A48">{{o.terms}}</span></div>
<span style="font-size: 18px; color: #2C5F50">{{o.amount}}</span>
</div>
</sc-for>
</div>
<div style="margin-top: auto; font-size: 16px; line-height: 1.45; color: #3A2516">Interest coming to you this season: about 140 , if everyone pays. Gnaeus has not.</div>
</div>
</sc-if>

<sc-if value="{{sp.p2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px; height: 100%">
<span style="font-family: Cinzel, serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: #3A2516">PARTNERS AND SHARES</span>
<sc-for list="{{partners}}" as="pt" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid rgba(58,37,22,0.12)">
<div style="flex: none; padding: 3px; background: #EFE3C8; box-shadow: 0 3px 8px rgba(0,0,0,0.3)"><img src="{{pt.face}}" alt="" style="display: block; width: 40px; height: 40px; image-rendering: pixelated"></div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 17px; color: #1F1710">{{pt.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #5A3A22">{{pt.loyal}}</span></div>
<span style="font-size: 14px; color: #6B5A48">{{pt.stake}}</span>
<span style="font-size: 15px; color: #3A2516">{{pt.note}}</span>
</div>
</div>
</sc-for>
<div style="margin-top: auto; font-size: 16px; line-height: 1.45; color: #3A2516">Partners share the risk and the profit. They also share your secrets, and some of them talk.</div>
</div>
</sc-if>
</div>

<!-- RIGHT PAGE -->
<div style="{{rp.style}}">
<sc-if value="{{sp.p0}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 13px; height: 100%">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #6B5A48">{{b.kindUpper}}</span>
<span style="font-family: Cinzel, serif; font-size: 23px; font-weight: 700; line-height: 1.2; color: #2A1A0E">{{b.name}}</span>
<span style="font-size: 15px; color: #5E5042">{{b.where}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">WHAT IT KEPT, SEASON BY SEASON</span>
<svg width="344" height="116" viewBox="0 0 344 116" role="img" aria-label="{{b.chartLabel}}">
<line x1="0" y1="88" x2="344" y2="88" style="stroke: rgba(58,37,22,0.6); stroke-width: 1px"></line>
<sc-for list="{{b.bars}}" as="bar" hint-placeholder-count="4">
<rect x="{{bar.x}}" y="{{bar.y}}" width="52" height="{{bar.h}}" style="{{bar.style}}"></rect>
<text x="{{bar.tx}}" y="{{bar.vy}}" style="font-family: 'IM Fell English', serif; font-size: 14px; fill: #2A1A0E; text-anchor: middle">{{bar.v}}</text>
<text x="{{bar.tx}}" y="107" style="font-family: 'IM Fell English', serif; font-size: 13px; fill: #6B5A48; text-anchor: middle">{{bar.season}}</text>
</sc-for>
</svg>
</div>
<div style="display: flex; gap: 14px; align-items: flex-start">
<div style="flex: none; padding: 3px; background: #EFE3C8; box-shadow: 0 3px 8px rgba(0,0,0,0.3); transform: rotate(-3deg)"><img src="{{b.mgrFace}}" alt="" style="display: block; width: 44px; height: 44px; image-rendering: pixelated"></div>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1">
<span style="font-size: 16px; color: #1F1710"><strong style="font-weight: 600">{{b.mgr}}</strong> runs it</span>
<sc-for list="{{b.traits}}" as="t" hint-placeholder-count="3">
<div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><span style="color: #4A3C30">{{t.name}} · {{t.guess}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 2px; color: #5A3A22">{{t.dots}}</span></div>
</sc-for>
</div>
</div>
<div style="padding: 6px 0 6px 14px; border-left: 2px solid rgba(138,90,18,0.6); font-size: 17px; line-height: 1.45; color: #1F1710">{{b.report}}</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">WHO OWNS IT</span>
<div style="display: flex; height: 10px; border: 1px solid rgba(58,37,22,0.6); border-radius: 2px; overflow: hidden"><div style="{{b.yourBar}}"></div><div style="flex: 1; background: rgba(90,58,34,0.12)"></div></div>
<span style="font-size: 15px; color: #3A2516">{{b.owners}}</span>
</div>
<sc-if value="{{b.hasThreat}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: auto; padding: 8px 12px; border: 1.5px solid rgba(142,44,28,0.75); color: #6E2214; font-size: 15px">{{b.threat}}</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{sp.p1}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px; height: 100%">
<span style="font-family: Cinzel, serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: #3A2516">YOUR BANKER</span>
<div style="display: flex; flex-direction: column">
<span style="font-size: 17px; color: #1F1710">The house of Sextus Octavius, Aquea</span>
<span style="font-size: 30px; color: #1F1710">12,400 </span>
<span style="font-size: 15px; color: #2C5F50">earning about 40 a month</span>
</div>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3A2516">Safe from road thieves. The house is sound, though talk of war in Ostoronia has some depositors nervous. If the war comes, there may be a run on the bank.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{bankActs}}" as="ba" hint-placeholder-count="3">
<button style="text-align: left; min-height: 44px; padding: 6px 0; border: none; border-bottom: 1px solid rgba(58,37,22,0.12); background: transparent; font-family: 'IM Fell English', serif; cursor: pointer; display: flex; flex-direction: column">
<span style="font-size: 17px; color: #1F1710">{{ba.act}}</span><span style="font-size: 14px; color: #6B5A48">{{ba.note}}</span>
</button>
</sc-for>
</div>
<div style="margin-top: auto; padding: 8px 12px; border: 1.5px solid rgba(138,90,18,0.7); color: #5A3A12; font-size: 15px">Later, with enough standing, you could open a bank of your own.</div>
</div>
</sc-if>

<sc-if value="{{sp.p2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px; height: 100%">
<span style="font-family: Cinzel, serif; font-size: 18px; font-weight: 700; letter-spacing: 0.1em; color: #3A2516">RIVALS IN THE TRADE</span>
<sc-for list="{{rivals}}" as="rv" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid rgba(58,37,22,0.12)">
<div style="display: flex; gap: 12px; align-items: center">
<div style="flex: none; padding: 3px; background: #EFE3C8; box-shadow: 0 3px 8px rgba(0,0,0,0.3)"><img src="{{rv.face}}" alt="" style="display: block; width: 40px; height: 40px; image-rendering: pixelated"></div>
<div style="display: flex; flex-direction: column"><span style="font-size: 18px; color: #1F1710">{{rv.name}}</span><span style="font-size: 14px; color: #6B5A48">{{rv.what}}</span></div>
</div>
<span style="font-size: 15px; color: #6E2214">{{rv.moves}}</span>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #6B5A48"><span>Their size beside yours</span><div style="flex: 1; height: 8px; background: rgba(90,58,34,0.12); border-radius: 4px"><div style="{{rv.bar}}"></div></div></div>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 15px; color: #3A2516"><span>Envy you draw</span><span>low, rising</span></div>
<div style="height: 6px; background: rgba(90,58,34,0.12); border-radius: 3px"><div style="width: 30%; height: 6px; border-radius: 3px; background: #8E2C1C"></div></div>
</div>
</div>
</sc-if>
</div>


<!-- the turning leaf -->
<div style="{{leaf.style}}">
<div class="leaf" style="position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: inset 30px 0 40px -20px rgba(70,40,20,0.35), 0 10px 30px rgba(0,0,0,0.35)"></div>

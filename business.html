<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estates — the land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Spectral:wght@400;500;600&amp;family=IM+Fell+English&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#191A14}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.4), 0 6px 12px rgba(0,0,0,0.35), 0 22px 44px rgba(0,0,0,0.5)}
.land{background-color:#22241A;background-image:linear-gradient(rgba(14,16,10,0.52), rgba(14,16,10,0.52)), radial-gradient(ellipse at 50% 40%, rgba(255,230,170,0.10) 0%, rgba(0,0,0,0) 55%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%), url(assets/377e71acdac37d44ad9791a31cc0d4be.jpg);background-size:auto, auto, auto, cover;background-position:center}
.kicker{font-family:Cinzel,serif;font-size:13px;font-weight:700;letter-spacing:0.14em;color:#3A2516}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #191A14; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">AQUEA · LATE AUTUMN</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><a href="#" style="{{n.style}}">{{n.label}}</a></sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<!-- YOUR PERSON READS THIS PAGE FOR YOU -->
<section aria-label="Summary" style="display: grid; grid-template-columns: 1fr 360px; gap: 22px; padding: 16px 20px; background: #EFE3C8; color: #2A2119; border-radius: 3px; box-shadow: 0 14px 30px rgba(0,0,0,0.45); border-left: 6px solid #9A6A12">
<div style="display: flex; gap: 16px; align-items: flex-start">
<img src="{{aide.face}}" alt="" style="flex: none; width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 3px #F6EAD0, 0 4px 10px rgba(0,0,0,0.3)">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #7E2A1A">{{aide.head}}</span>
<sc-for list="{{aide.says}}" as="ai" hint-placeholder-count="3"><span style="{{ai.style}}">{{ai.t}}</span></sc-for>
<span style="font-size: 13px; color: #6B5A48">{{aide.foot}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-left: 20px; border-left: 1px solid rgba(58,37,22,0.2)">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6B5A48">{{aide.askLabel}}</span>
<div role="radiogroup" aria-label="{{aide.askLabel}}" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px">
<sc-for list="{{aide.levels}}" as="al" hint-placeholder-count="3"><button role="radio" aria-checked="{{al.on}}" onClick="{{al.click}}" style="{{al.style}}">{{al.label}}</button></sc-for>
</div>
<span style="font-size: 14px; line-height: 1.4; color: #1F1710">{{aide.will}}</span>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #CFD8A8">WHAT YOU OWN</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">Your business</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><span style="{{c.style}}">{{c.text}}</span></sc-for>
</div>
</div>

<div style="overflow-x: auto">
<div class="land" style="width: 1376px; box-sizing: border-box; padding: 30px; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 2px #23241B; display: grid; grid-template-columns: 330px 1fr; gap: 28px; align-items: start">

<!-- TABS -->
<div role="tablist" aria-label="What you own" style="grid-column: 1 / -1; display: flex; gap: 12px; flex-wrap: wrap">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
<button role="tab" onClick="{{tb.click}}" style="{{tb.style}}"><span style="font-family: Cinzel, serif; font-size: 17px; font-weight: 700">{{tb.label}}</span><span style="font-size: 13px; opacity: 0.85">{{tb.sub}}</span></button>
</sc-for>
</div>

<!-- ESTATE LIST -->
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{list}}" as="e" hint-placeholder-count="5">
<button class="paper" onClick="{{e.pick}}" style="{{e.style}}">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 17px; font-weight: 700; color: #2A1A0E; text-align: left">{{e.name}}</span>
<sc-if value="{{e.hasBadge}}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; background: #8E2418; color: #FFF6E4">{{e.badge}}</span></sc-if>
</span>
<span style="font-size: 14px; color: #6B5A48; text-align: left">{{e.sub}}</span>
<span style="display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 4px">
<sc-for list="{{e.bar}}" as="b" hint-placeholder-count="4"><span style="{{b.style}}"></span></sc-for>
</span>
<span style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 2px"><span style="color: #3A2516">{{e.focus}}</span><span style="font-family: 'IBM Plex Mono', monospace; color: #2C5F50">{{e.income}}</span></span>
</button>
</sc-for>
<span style="font-size: 13px; color: #E6E0C8; text-shadow: 0 1px 2px rgba(0,0,0,0.8); padding: 4px 4px 0">{{listNote}}</span>
</div>

<!-- SELECTED ESTATE -->
<sc-if value="{{ownView}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 22px; min-width: 0">

<div class="paper" style="padding: 22px 26px; color: #2A2119; display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; min-width: 0">
<span class="kicker" style="color: #5A6B2A">{{s.kindUpper}}</span>
<span style="font-family: Cinzel, serif; font-size: 30px; font-weight: 700; line-height: 1.15; color: #2A1A0E">{{s.name}}</span>
<span style="font-size: 16px; color: #3A2516">{{s.where}}</span>
<span style="font-size: 15px; color: #6B5A48; margin-top: 4px">{{s.season}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 380px">
<span style="font-size: 14px; color: #6B5A48">How you run it</span>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #5A3A22; border-radius: 3px; overflow: hidden">
<sc-for list="{{focusSeg}}" as="o" hint-placeholder-count="3"><button onClick="{{o.click}}" style="{{o.style}}">{{o.label}}</button></sc-for>
</div>
<span style="font-size: 13px; color: #6B5A48">{{focusNote}}</span>
</div>
</div>

<div style="display: grid; grid-template-columns: 340px 1fr; gap: 22px; align-items: start">
<!-- steward -->
<div class="paper" style="padding: 20px 22px; color: #2A2119; transform: rotate(-0.4deg); display: flex; flex-direction: column; gap: 10px">
<span class="kicker">{{s.stewardRole}}</span>
<div style="display: flex; gap: 14px; align-items: center">
<div style="flex: none; padding: 4px; background: #F6EAD0; box-shadow: 0 3px 8px rgba(0,0,0,0.3)"><img src="{{s.face}}" alt="" style="display: block; width: 56px; height: 56px; image-rendering: pixelated"></div>
<div style="display: flex; flex-direction: column"><span style="font-family: Cinzel, serif; font-size: 20px; font-weight: 700; color: #2A1A0E">{{s.steward}}</span><span style="font-size: 14px; color: #6B5A48">{{s.stewardSince}}</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{s.traits}}" as="t" hint-placeholder-count="3"><span style="{{t.style}}">{{t.label}}</span></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; justify-content: space-between; font-size: 14px"><span style="color: #6B5A48">Loyalty</span><span style="color: #3A2516">{{s.loyaltyWord}}</span></span>
<div style="height: 8px; border-radius: 4px; background: rgba(58,37,22,0.15)"><div style="{{s.loyaltyBar}}"></div></div>
</div>
<span style="font-family: 'IM Fell English', serif; font-size: 17px; line-height: 1.4; color: #1F1710">{{s.quote}}</span>
<sc-if value="{{s.audited}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #1F1710; padding: 8px 10px; background: rgba(44,95,80,0.12); border-left: 3px solid #2C5F50; animation: fadein 0.4s ease-out both">{{s.auditResult}}</span></sc-if>
<div style="display: flex; gap: 8px">
<button onClick="{{audit}}" style="{{auditBtn}}">{{auditLabel}}</button>
<button style="flex: 1; min-height: 42px; background: transparent; color: #2A1A0E; border: 1px solid #5A3A22; border-radius: 3px; font-family: Spectral, serif; font-size: 14px; cursor: pointer">Replace</button>
</div>
</div>

<!-- this season -->
<div class="paper" style="padding: 20px 24px; color: #2A2119; transform: rotate(0.3deg); display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px"><span class="kicker">THIS SEASON</span><span style="font-size: 14px; color: #6B5A48">{{s.when}}</span></div>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
<sc-for list="{{season}}" as="k" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">{{k.k}}</span><span style="{{k.style}}">{{k.v}}</span><span style="font-size: 12px; color: #6B5A48">{{k.sub}}</span></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: #6B5A48">{{gradeTitle}}</span>
<div style="display: flex; height: 22px; border-radius: 3px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(58,37,22,0.3)">
<sc-for list="{{grades}}" as="g" hint-placeholder-count="4"><span style="{{g.style}}">{{g.pct}}</span></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
<sc-for list="{{grades}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column"><span style="{{g.labelStyle}}">{{g.grade}}</span><span style="font-size: 13px; color: #3A2516">{{g.name}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B5A48">{{g.price}}</span></div>
</sc-for>
</div>
</div>
<span style="font-size: 14px; color: #3A2516; padding-top: 8px; border-top: 1px solid rgba(58,37,22,0.15)">{{s.buyers}}</span>
</div>
</div>

<!-- decisions -->
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #EFE6CC; text-shadow: 0 1px 3px rgba(0,0,0,0.8)">{{decisionsTitle}}</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start">
<sc-for list="{{cards}}" as="d" hint-placeholder-count="2">
<div class="paper" style="{{d.style}}">
<span style="font-size: 13px; color: #8E2418; font-weight: 600">{{d.from}}</span>
<span style="font-family: Cinzel, serif; font-size: 19px; font-weight: 700; line-height: 1.25; color: #2A1A0E">{{d.title}}</span>
<span style="font-size: 16px; line-height: 1.45; color: #1F1710">{{d.text}}</span>
<sc-if value="{{d.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding-top: 4px">
<sc-for list="{{d.choices}}" as="ch" hint-placeholder-count="3">
<button onClick="{{ch.click}}" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 48px; padding: 8px 14px; background: rgba(255,250,238,0.55); border: 1px solid rgba(58,37,22,0.35); border-radius: 3px; font-family: Spectral, serif; text-align: left; cursor: pointer">
<span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{ch.label}}</span><span style="font-size: 13px; color: #6B5A48">{{ch.hint}}</span></span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #5A3A22; white-space: nowrap">{{ch.cost}}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{d.done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: rgba(44,95,80,0.1); border-left: 3px solid #2C5F50; animation: fadein 0.4s ease-out both">
<span style="font-size: 13px; color: #2C5F50; font-weight: 600">{{d.chosen}}</span>
<span style="font-size: 15px; color: #1F1710">{{d.outcome}}</span>
<button onClick="{{d.undo}}" style="align-self: flex-start; min-height: 32px; padding: 2px 0; border: none; background: transparent; color: #6B5A48; font-family: Spectral, serif; font-size: 13px; text-decoration: underline; cursor: pointer">Choose again</button>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start">
<!-- storage -->
<div class="paper" style="padding: 20px 24px; color: #2A2119; transform: rotate(-0.3deg); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px"><span class="kicker">{{s.storeName}}</span><span style="font-size: 13px; color: #6B5A48">{{s.storeCap}}</span></div>
<sc-for list="{{stock}}" as="st" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<div style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; color: #1F1710">{{st.what}}</span><span style="font-size: 13px; color: #6B5A48">{{st.note}}</span></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3A2516; white-space: nowrap">{{st.value}}</span>
<button onClick="{{st.sell}}" style="{{st.btn}}">{{st.btnLabel}}</button>
</div>
</sc-for>
<div style="display: flex; gap: 14px; align-items: center; padding-top: 6px">
<svg width="170" height="54" viewBox="0 0 170 54" role="img" aria-label="{{s.trendAria}}" style="flex: none; background: rgba(255,250,238,0.5); border: 1px solid rgba(58,37,22,0.2)">
<polyline points="{{s.spark}}" style="fill: none; stroke: #2C5F50; stroke-width: 2px; stroke-linejoin: round"></polyline>
<circle cx="{{s.sparkX}}" cy="{{s.sparkY}}" r="3.5" style="fill: #8E2418"></circle>
</svg>
<span style="font-size: 14px; line-height: 1.4; color: #1F1710">{{s.trend}}</span>
</div>
<span style="font-size: 13px; color: #8E2418">{{s.spoil}}</span>
</div>

<!-- investments -->
<div class="paper" style="padding: 20px 24px; color: #2A2119; transform: rotate(0.4deg); display: flex; flex-direction: column; gap: 10px">
<span class="kicker">IMPROVEMENTS</span>
<sc-for list="{{ups}}" as="u" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px">
<div style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{u.name}}</span><span style="font-size: 13px; color: #6B5A48">{{u.effect}}</span></div>
<button onClick="{{u.click}}" style="{{u.btn}}">{{u.btnLabel}}</button>
</div>
<sc-if value="{{u.building}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px"><div style="flex: 1; height: 6px; border-radius: 3px; background: rgba(58,37,22,0.15)"><div style="{{u.bar}}"></div></div><span style="font-size: 12px; color: #6B5A48; white-space: nowrap">{{u.eta}}</span></div>
</sc-if>
</div>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start">
<div class="paper" style="padding: 20px 24px; color: #2A2119; transform: rotate(-0.2deg); display: flex; flex-direction: column; gap: 8px">
<span class="kicker">NEIGHBOURS AND NAME</span>
<sc-for list="{{s.neighbours}}" as="nb" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)"><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{nb.title}}</span><span style="font-size: 14px; color: #3A2516">{{nb.text}}</span></div>
</sc-for>
</div>
<div style="padding: 18px 22px; background: rgba(12,14,10,0.78); border: 1px solid rgba(207,216,168,0.25); border-radius: 4px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 14px 30px rgba(0,0,0,0.45)">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #CFD8A8">IN MINECRAFT</span>
<span style="font-size: 15px; line-height: 1.45; color: #E8E0CC">{{s.mc}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9AA58A">{{s.mcCoords}}</span>
<button onClick="{{toggleVisit}}" style="align-self: flex-start; min-height: 42px; padding: 6px 16px; background: #E9C982; color: #2A1A0E; border: none; border-radius: 3px; font-family: Spectral, serif; font-size: 15px; font-weight: 600; cursor: pointer">{{visitLabel}}</button>
</div>
</div>

<sc-if value="{{visitOpen}}" hint-placeholder-val="{{ false }}">
<div class="paper" style="padding: 22px 24px; color: #2A2119; display: grid; grid-template-columns: 430px 1fr; gap: 26px; align-items: start; animation: fadein 0.4s ease-out both; border-top: 4px solid #8E2418">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="kicker" style="color: #8E2418">PLAN A VISIT</span>
<div style="position: relative; width: 430px; height: 300px; box-shadow: 0 0 0 1px rgba(58,37,22,0.35), 0 6px 14px rgba(0,0,0,0.25)">
<svg width="430" height="300" viewBox="{{v.box}}" role="img" aria-label="{{v.aria}}" style="display: block">
<image href="assets/9f5158a39938dfbadce3acb1871c8938.jpg" x="0" y="0" width="1600" height="1000"></image>
<path d="{{v.route}}" style="fill: none; stroke: #8E2418; stroke-width: 3px; stroke-dasharray: 8 6; stroke-linecap: round"></path>

<link rel="preconnect" href="https://fonts.googleapis.com">

body{margin:0;background:#1D1813}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.4), 0 6px 12px rgba(0,0,0,0.35), 0 22px 44px rgba(0,0,0,0.5)}
.awning{background-color:#2A231C;background-image:linear-gradient(rgba(20,15,10,0.5), rgba(20,15,10,0.5)), radial-gradient(ellipse at 60% 20%, rgba(255,226,170,0.12) 0%, rgba(0,0,0,0) 55%), radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.5) 100%), url(assets/69b67fdf5dacc46b909416fd9e860cfc.jpg);background-size:auto, auto, auto, cover;background-position:center}
.kicker{font-family:Cinzel,serif;font-size:13px;font-weight:700;letter-spacing:0.14em;color:#3A2516}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes ring{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #1D1813; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">{{where}}</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5"><a href="#" style="{{n.style}}">{{n.label}}</a></sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #E6C29A">SUB HASTA · UNDER THE SPEAR</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">Auctions</h1>
</div>
<div role="tablist" aria-label="City" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{cities}}" as="c" hint-placeholder-count="3"><button role="tab" onClick="{{c.click}}" style="{{c.style}}"><span style="font-family: Cinzel, serif; font-size: 15px; font-weight: 700">{{c.name}}</span><span style="font-size: 12px; opacity: 0.85">{{c.sub}}</span></button></sc-for>
</div>
</div>

<div style="overflow-x: auto">
<div class="awning" style="width: 1376px; box-sizing: border-box; padding: 28px 30px 36px; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); display: grid; grid-template-columns: 400px 1fr; gap: 26px; align-items: start">

<!-- LOTS -->
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="{{presence.style}}">
<img src="{{presence.face}}" alt="" style="width: 40px; height: 40px; image-rendering: pixelated; box-shadow: 0 0 0 2px #F6EAD0">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">{{presence.title}}</span><span style="font-size: 13px; opacity: 0.85">{{presence.note}}</span></span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{cats}}" as="ct" hint-placeholder-count="5"><button onClick="{{ct.click}}" style="{{ct.style}}">{{ct.label}}</button></sc-for>
</div>
<sc-for list="{{lots}}" as="l" hint-placeholder-count="6">
<button class="paper" onClick="{{l.pick}}" style="{{l.style}}">
<span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #8E2418">{{l.cat}}</span><span style="{{l.tagStyle}}">{{l.tag}}</span></span>
<span style="font-family: Cinzel, serif; font-size: 16px; font-weight: 700; line-height: 1.25; color: #2A1A0E; text-align: left">{{l.name}}</span>
<span style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><span style="color: #6B5A48; text-align: left">{{l.when}}</span><span style="font-family: 'IBM Plex Mono', monospace; color: #1F1710">{{l.price}}</span></span>
</button>
</sc-for>
</div>

<!-- THE LOT ON THE BLOCK -->
<div style="display: flex; flex-direction: column; gap: 22px; min-width: 0">
<div class="paper" style="padding: 24px 28px; color: #2A2119; display: flex; flex-direction: column; gap: 14px; animation: fadein 0.35s ease-out both">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; min-width: 0; max-width: 560px">
<span class="kicker" style="color: #8E2418">{{lot.kicker}}</span>
<span style="font-family: Cinzel, serif; font-size: 28px; font-weight: 700; line-height: 1.15; color: #2A1A0E">{{lot.name}}</span>
<span style="font-size: 16px; line-height: 1.45; color: #1F1710">{{lot.text}}</span>
</div>
<div style="display: flex; gap: 12px; align-items: center">
<img src="{{lot.sellerFace}}" alt="" style="width: 44px; height: 44px; image-rendering: pixelated; box-shadow: 0 0 0 2px #F6EAD0, 0 3px 6px rgba(0,0,0,0.3)">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">Sold by</span><span style="font-size: 15px; font-weight: 600; color: #1F1710">{{lot.seller}}</span><span style="font-size: 13px; color: #6B5A48">{{lot.sellerNote}}</span></div>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="kicker">WHAT’S IN THE LOT</span>
<sc-for list="{{lot.contents}}" as="ci" hint-placeholder-count="4">
<div style="display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: rgba(30,28,26,0.9); border-radius: 2px"><span style="font-family: VT323, monospace; font-size: 20px; color: #FFFFFF; flex: 1">{{ci.name}}</span><span style="font-family: VT323, monospace; font-size: 20px; color: #FFFF55">{{ci.qty}}</span></div>
</sc-for>
<span style="font-size: 13px; color: #6B5A48">{{lot.contentsNote}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span class="kicker">{{lot.deliverTitle}}</span>
<sc-if value="{{lot.isPallet}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{dest}}" as="d" hint-placeholder-count="3"><button onClick="{{d.click}}" style="{{d.style}}"><span style="{{d.radio}}"></span><span style="display: flex; flex-direction: column; text-align: left"><span style="font-size: 15px; color: #1F1710">{{d.name}}</span><span style="font-size: 13px; color: #6B5A48">{{d.note}}</span></span></button></sc-for>
</div>
</sc-if>
<span style="font-size: 14px; line-height: 1.45; color: #1F1710">{{lot.deliverNote}}</span>
<span class="kicker" style="margin-top: 6px">LAST TIME, SIMILAR LOTS WENT FOR</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; color: #1F1710">{{lot.past}}</span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: 1fr 360px; gap: 22px; align-items: start">
<!-- the bidding -->
<div class="paper" style="padding: 22px 26px; color: #2A2119; display: flex; flex-direction: column; gap: 12px; transform: rotate(-0.3deg)">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-size: 14px; color: #6B5A48">{{bid.label}}</span>
<span style="{{bid.priceStyle}}">{{bid.price}}</span>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<img src="{{bid.leaderFace}}" alt="" style="width: 44px; height: 44px; image-rendering: pixelated; box-shadow: 0 0 0 2px #F6EAD0">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">Highest bidder</span><span style="{{bid.leaderStyle}}">{{bid.leader}}</span></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; max-height: 150px; overflow: hidden; padding: 8px 12px; background: rgba(255,250,238,0.55); border: 1px solid rgba(58,37,22,0.2); border-radius: 3px">
<sc-for list="{{bid.history}}" as="h" hint-placeholder-count="5"><span style="{{h.style}}">{{h.text}}</span></sc-for>
</div>
<sc-if value="{{bid.open}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #6B5A48">Your ceiling: the herald bids for you, a step at a time, up to this and no further.</span>
<div style="display: flex; align-items: center; gap: 10px">
<button onClick="{{bid.down}}" aria-label="Lower your ceiling" style="width: 46px; height: 46px; border: 1px solid #5A3A22; background: transparent; border-radius: 3px; font-size: 22px; color: #3A2516; cursor: pointer">−</button>
<span style="flex: 1; text-align: center; font-family: Cinzel, serif; font-size: 28px; font-weight: 700; color: #2A1A0E">{{bid.ceiling}}</span>
<button onClick="{{bid.up}}" aria-label="Raise your ceiling" style="width: 46px; height: 46px; border: 1px solid #5A3A22; background: transparent; border-radius: 3px; font-size: 22px; color: #3A2516; cursor: pointer">+</button>
</div>
<div style="display: flex; gap: 8px">
<button onClick="{{bid.place}}" style="flex: 1; min-height: 50px; background: #8E2418; color: #FFF6E4; border: none; border-radius: 3px; font-family: Cinzel, serif; font-size: 15px; font-weight: 700; letter-spacing: 0.05em; cursor: pointer">{{bid.placeLabel}}</button>
<button onClick="{{bid.hammer}}" style="min-height: 50px; padding: 4px 16px; background: transparent; color: #2A1A0E; border: 1px solid #5A3A22; border-radius: 3px; font-family: Spectral, serif; font-size: 14px; cursor: pointer">Let the hammer fall</button>
</div>
<span style="font-size: 13px; color: #6B5A48">{{bid.hint}}</span>
</div>
</sc-if>
<sc-if value="{{bid.ended}}" hint-placeholder-val="{{ false }}">
<div style="{{bid.endStyle}}"><span style="font-size: 16px; font-weight: 600">{{bid.endTitle}}</span><span style="font-size: 14px">{{bid.endText}}</span><button onClick="{{bid.reopen}}" style="align-self: flex-start; min-height: 30px; padding: 0; border: none; background: transparent; color: inherit; opacity: 0.75; font-family: Spectral, serif; font-size: 13px; text-decoration: underline; cursor: pointer">Run it again</button></div>
</sc-if>
</div>

<!-- your bids -->
<div class="paper" style="padding: 20px 22px; color: #2A2119; display: flex; flex-direction: column; gap: 8px; transform: rotate(0.5deg)">
<span class="kicker">YOUR BIDS TODAY</span>
<sc-for list="{{mine}}" as="m" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(58,37,22,0.12)"><span style="font-size: 14px; color: #1F1710">{{m.name}}</span><span style="{{m.style}}">{{m.state}}</span></div>
</sc-for>
<sc-if value="{{noMine}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #6B5A48">No bids yet. Pick a lot and set your ceiling.</span></sc-if>
<span style="font-size: 13px; color: #6B5A48; padding-top: 6px; border-top: 1px solid rgba(58,37,22,0.15)">Pay when the hammer falls. Pallets are packed into crates and carted to you; open them in Minecraft and the blocks are yours.</span>
</div>
</div>
</div>

</div>
</div>
</main>
</div>
</template>
<script src="dc-runtime.js"></script>

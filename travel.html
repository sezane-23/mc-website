<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travel — the road</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Spectral:wght@400;500;600&amp;family=IM+Fell+English&amp;family=IBM+Plex+Mono:wght@400;600&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#1B1A19}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#F3D27E}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px;box-shadow:0 1px 1px rgba(0,0,0,0.4), 0 6px 12px rgba(0,0,0,0.35), 0 24px 46px rgba(0,0,0,0.5)}
.road{background-color:#2A241E;background-image:linear-gradient(rgba(22,18,14,0.38), rgba(22,18,14,0.38)), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.5) 100%), url(assets/9cca28775fc0a10ecba9c20c7ee81507.jpg);background-size:auto, auto, cover;background-position:center;background-repeat:no-repeat}
.tack{position:absolute;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #FFE8B0 0%, #CC9A40 35%, #7A5218 75%, #4A300C 100%);box-shadow:0 3px 4px rgba(0,0,0,0.6)}
@keyframes march{to{stroke-dashoffset:-56}}
@keyframes journey{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px #6B4A16, 0 8px 22px rgba(232,194,106,0.25), inset 0 1px 0 rgba(255,250,230,0.7)}50%{box-shadow:0 0 0 1px #6B4A16, 0 8px 34px rgba(232,194,106,0.55), inset 0 1px 0 rgba(255,250,230,0.7)}}
@keyframes pulse{0%{r:14;opacity:0.9}100%{r:40;opacity:0}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.35}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: #1B1A19; color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">{{whereHeader}}</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="{{n.style}}">{{n.label}}</a>
</sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #D8C49A">THE ROAD</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">Plan a journey</h1>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<span style="font-size: 15px; padding: 6px 14px; border-radius: 999px; background: rgba(242,232,213,0.1); color: #F2E8D5; border: 1px solid rgba(242,232,213,0.25)">{{hereChip}}</span>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; padding: 6px 14px; border-radius: 999px; background: rgba(120,190,150,0.14); color: #BFE6CC; border: 1px solid rgba(120,190,150,0.35)"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #6FD08C; box-shadow: 0 0 8px #6FD08C; animation: blink 2.4s ease-in-out infinite"></span>Minecraft: online, standing in the forum</span>
</div>
</div>

<div style="overflow-x: auto">
<div class="road" style="position: relative; width: 1376px; box-sizing: border-box; padding: 30px; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 0 2px #232120; display: grid; grid-template-columns: 880px 1fr; gap: 30px; align-items: start">

<!-- LEFT: map + legs -->
<div style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: -12px">
<div role="tablist" aria-label="How far" style="display: inline-grid; grid-template-columns: 1fr 1fr; padding: 4px; gap: 4px; background: rgba(18,14,10,0.62); border: 1px solid rgba(242,232,213,0.22); border-radius: 999px">
<sc-for list="{{scopes}}" as="sc" hint-placeholder-count="2"><button role="tab" onClick="{{sc.click}}" style="{{sc.style}}">{{sc.label}}</button></sc-for>
</div>
<span style="font-size: 15px; color: #E6D6B4; text-shadow: 0 1px 2px rgba(0,0,0,0.8)">{{scopeHint}}</span>
</div>
<div style="position: relative; width: 880px; height: 550px; transform: rotate(-0.3deg); box-shadow: 0 2px 2px rgba(0,0,0,0.45), 0 12px 24px rgba(0,0,0,0.4), 0 34px 70px rgba(0,0,0,0.5)">
<sc-if value="{{landView}}" hint-placeholder-val="{{ true }}">
<svg width="880" height="550" viewBox="0 0 1600 1000" role="img" aria-label="Map of the continent with your planned route" style="position: absolute; left: 0; top: 0; display: block">
<image href="assets/9f5158a39938dfbadce3acb1871c8938.jpg" x="0" y="0" width="1600" height="1000"></image>
<sc-for list="{{countries}}" as="c" hint-placeholder-count="5">
<path d="{{c.d}}" style="{{c.style}}"></path>
</sc-for>
<sc-for list="{{roads}}" as="r" hint-placeholder-count="60">
<path d="{{r.d}}" style="{{r.style}}"></path>
</sc-for>
<path d="{{routeD}}" style="fill: none; stroke: rgba(255,244,214,0.85); stroke-width: 14px; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{routeD}}" style="fill: none; stroke: #8E2418; stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18 10; animation: march 1.6s linear infinite"></path>
<sc-for list="{{dangers}}" as="dg" hint-placeholder-count="2">
<g>
<circle cx="{{dg.x}}" cy="{{dg.y}}" r="15" style="fill: #9C2E1E; stroke: #F6EAD0; stroke-width: 3px"></circle>
<text x="{{dg.x}}" y="{{dg.ty}}" style="font-family: Spectral, serif; font-size: 22px; font-weight: 600; fill: #FFF6E4; text-anchor: middle">!</text>
<text x="{{dg.x}}" y="{{dg.ly}}" style="font-family: Spectral, serif; font-size: 21px; font-weight: 600; fill: #7E1E12; text-anchor: middle; paint-order: stroke; stroke: rgba(246,236,212,0.95); stroke-width: 6px">{{dg.label}}</text>
</g>
</sc-for>
<sc-for list="{{towns}}" as="t" hint-placeholder-count="24">
<g onClick="{{t.pick}}" style="cursor: pointer">
<title>{{t.title}}</title>
<circle cx="{{t.x}}" cy="{{t.y}}" r="24" style="fill: rgba(0,0,0,0)"></circle>
<circle cx="{{t.x}}" cy="{{t.y}}" r="{{t.r}}" style="{{t.dot}}"></circle>
<text x="{{t.lx}}" y="{{t.ly}}" style="{{t.label}}">{{t.name}}</text>
</g>
</sc-for>
<sc-for list="{{badges}}" as="b" hint-placeholder-count="2">
<g style="pointer-events: none">
<circle cx="{{b.x}}" cy="{{b.y}}" r="14" style="fill: #3A2516; animation: pulse 1.8s ease-out infinite"></circle>
<circle cx="{{b.x}}" cy="{{b.y}}" r="16" style="fill: #C9962A; stroke: #2A1A0E; stroke-width: 3px"></circle>
<text x="{{b.x}}" y="{{b.ty}}" style="font-family: Cinzel, serif; font-size: 19px; font-weight: 700; fill: #2A1A0E; text-anchor: middle">{{b.n}}</text>
</g>
</sc-for>
<sc-if value="{{showYou}}" hint-placeholder-val="{{ true }}">
<g style="pointer-events: none">
<rect x="{{you.rx}}" y="{{you.ry}}" width="52" height="52" style="fill: #F6EAD0; stroke: #2A1A0E; stroke-width: 3px"></rect>
<image href="assets/009faa795ce967e9ad726e9f5012f930.png" x="{{you.ix}}" y="{{you.iy}}" width="44" height="44" style="image-rendering: pixelated"></image>
<text x="{{you.x}}" y="{{you.ty}}" style="font-family: Cinzel, serif; font-size: 20px; font-weight: 700; fill: #2A1A0E; text-anchor: middle; paint-order: stroke; stroke: rgba(246,236,212,0.95); stroke-width: 6px">You</text>
</g>
</sc-if>
</svg>
</sc-if>
<sc-if value="{{oceanView}}" hint-placeholder-val="{{ false }}">
<svg width="880" height="550" viewBox="0 0 1600 1000" role="img" aria-label="Chart of the outer sea, your continent and the lands across it" style="position: absolute; left: 0; top: 0; display: block">
<defs><pattern id="wpaper" patternUnits="userSpaceOnUse" width="420" height="420"><image href="assets/9c7efc059b51944b3cd05c0456c88232.jpg" x="0" y="0" width="420" height="420"></image></pattern></defs>
<rect x="0" y="0" width="1600" height="1000" style="fill: url(#wpaper)"></rect>
<rect x="0" y="0" width="1600" height="1000" style="fill: #5E8496; opacity: 0.30"></rect>
<sc-for list="{{world.swells}}" as="sw" hint-placeholder-count="20"><path d="{{sw.d}}" style="fill: none; stroke: rgba(30,62,84,0.20); stroke-width: 2px; stroke-linecap: round"></path></sc-for>
<g transform="translate(40,260) scale(0.42)">
<sc-for list="{{world.home}}" as="h" hint-placeholder-count="5"><path d="{{h.d}}" style="fill: none; stroke: rgba(30,62,84,0.18); stroke-width: 60px; stroke-linejoin: round"></path></sc-for>
<sc-for list="{{world.home}}" as="h" hint-placeholder-count="5"><path d="{{h.d}}" style="fill: #EADBB6; stroke: #EADBB6; stroke-width: 3px"></path></sc-for>
<sc-for list="{{world.home}}" as="h" hint-placeholder-count="5"><path d="{{h.d}}" style="{{h.tint}}"></path></sc-for>
<path d="{{world.landPath}}" style="fill: none; stroke: rgba(255,244,214,0.9); stroke-width: 26px; stroke-linecap: round; stroke-linejoin: round"></path>
<path d="{{world.landPath}}" style="fill: none; stroke: #8E2418; stroke-width: 11px; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30 18"></path>
</g>
<sc-for list="{{world.lands}}" as="w" hint-placeholder-count="5"><path d="{{w.d}}" style="fill: none; stroke: rgba(30,62,84,0.18); stroke-width: 26px; stroke-linejoin: round"></path></sc-for>
<sc-for list="{{world.lands}}" as="w" hint-placeholder-count="5"><path d="{{w.d}}" style="{{w.fill}}"></path></sc-for>
<path d="{{world.border}}" style="fill: none; stroke: #5A3A22; stroke-opacity: 0.6; stroke-width: 2.5px; stroke-dasharray: 10 6"></path>
<sc-for list="{{world.labels}}" as="lb" hint-placeholder-count="7"><text x="{{lb.x}}" y="{{lb.y}}" style="{{lb.style}}">{{lb.t}}</text></sc-for>
<sc-for list="{{world.lanes}}" as="ln" hint-placeholder-count="3"><path d="{{ln.d}}" style="{{ln.style}}"></path></sc-for>
<sc-for list="{{world.dangers}}" as="dg" hint-placeholder-count="1">
<g>
<circle cx="{{dg.x}}" cy="{{dg.y}}" r="15" style="fill: #9C2E1E; stroke: #F6EAD0; stroke-width: 3px"></circle>
<text x="{{dg.x}}" y="{{dg.ty}}" style="font-family: Spectral, serif; font-size: 22px; font-weight: 600; fill: #FFF6E4; text-anchor: middle">!</text>
<text x="{{dg.x}}" y="{{dg.ly}}" style="font-family: Spectral, serif; font-size: 21px; font-weight: 600; fill: #7E1E12; text-anchor: middle; paint-order: stroke; stroke: rgba(246,236,212,0.95); stroke-width: 6px">{{dg.label}}</text>
</g>
</sc-for>
<sc-for list="{{world.homePorts}}" as="hp" hint-placeholder-count="2">
<g><circle cx="{{hp.x}}" cy="{{hp.y}}" r="9" style="fill: #2A1A0E; stroke: #F6EAD0; stroke-width: 3px"></circle>
<text x="{{hp.lx}}" y="{{hp.ly}}" style="font-family: 'IM Fell English', serif; font-size: 24px; fill: #2A1A0E; text-anchor: end; paint-order: stroke; stroke: rgba(246,236,212,0.9); stroke-width: 6px">{{hp.name}}</text></g>
</sc-for>
<sc-for list="{{world.ports}}" as="pt" hint-placeholder-count="3">
<g onClick="{{pt.pick}}" style="cursor: pointer">
<title>{{pt.title}}</title>
<circle cx="{{pt.x}}" cy="{{pt.y}}" r="30" style="fill: rgba(0,0,0,0)"></circle>
<circle cx="{{pt.x}}" cy="{{pt.y}}" r="12" style="{{pt.dot}}"></circle>
<text x="{{pt.lx}}" y="{{pt.ly}}" style="{{pt.label}}">{{pt.name}}</text>
</g>
</sc-for>
<sc-if value="{{world.hasBadge}}" hint-placeholder-val="{{ true }}">
<g style="pointer-events: none">
<circle cx="{{world.badge.x}}" cy="{{world.badge.y}}" r="14" style="fill: #3A2516; animation: pulse 1.8s ease-out infinite"></circle>
<circle cx="{{world.badge.x}}" cy="{{world.badge.y}}" r="16" style="fill: #C9962A; stroke: #2A1A0E; stroke-width: 3px"></circle>
<text x="{{world.badge.x}}" y="{{world.badge.ty}}" style="font-family: Cinzel, serif; font-size: 19px; font-weight: 700; fill: #2A1A0E; text-anchor: middle">1</text>
</g>
</sc-if>
<sc-if value="{{showYou}}" hint-placeholder-val="{{ true }}">
<g style="pointer-events: none">
<rect x="{{world.you.rx}}" y="{{world.you.ry}}" width="52" height="52" style="fill: #F6EAD0; stroke: #2A1A0E; stroke-width: 3px"></rect>
<image href="assets/009faa795ce967e9ad726e9f5012f930.png" x="{{world.you.ix}}" y="{{world.you.iy}}" width="44" height="44" style="image-rendering: pixelated"></image>
<text x="{{world.you.x}}" y="{{world.you.ty}}" style="font-family: Cinzel, serif; font-size: 20px; font-weight: 700; fill: #2A1A0E; text-anchor: middle; paint-order: stroke; stroke: rgba(246,236,212,0.95); stroke-width: 6px">You</text>
</g>
</sc-if>
</svg>
</sc-if>
<sc-if value="{{going}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; transform: scale(0.55); transform-origin: 0 0; pointer-events: none">
<div style="{{traveller}}"><img src="assets/009faa795ce967e9ad726e9f5012f930.png" alt="" style="display: block; width: 44px; height: 44px; image-rendering: pixelated; border: 4px solid #F6EAD0; box-shadow: 0 0 0 3px #2A1A0E, 0 0 30px rgba(255,220,140,0.9)"></div>
</div>
</sc-if>
<div style="position: absolute; left: 18px; bottom: 16px; padding: 8px 14px; background: rgba(246,236,212,0.92); border: 1px solid rgba(58,37,22,0.35); font-size: 14px; color: #3A2516; display: flex; gap: 14px; align-items: center">
<span>{{mapHint}}</span>
</div>
<span class="tack" aria-hidden="true" style="left: 10px; top: 10px"></span>
<span class="tack" aria-hidden="true" style="right: 10px; top: 10px"></span>
<span class="tack" aria-hidden="true" style="right: 10px; bottom: 10px"></span>
</div>

<div style="display: grid; grid-template-columns: 1fr 330px; gap: 26px; align-items: start">
<div class="paper" style="padding: 22px 24px; color: #2A2119; transform: rotate(0.4deg); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #3A2516">{{legsTitle}}</span>
<span style="font-size: 14px; color: #6B5A48">{{legCount}}</span>
</div>
<sc-for list="{{legs}}" as="l" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 8px 0; border-top: 1px solid rgba(58,37,22,0.14)">
<span style="{{l.iconStyle}}">{{l.icon}}</span>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 16px; color: #1F1710">{{l.title}}</span>
<span style="font-size: 14px; color: #6B5A48">{{l.how}}</span>
<sc-if value="{{l.hasNote}}" hint-placeholder-val="{{ false }}"><span style="{{l.noteStyle}}">{{l.note}}</span></sc-if>
</div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3A2516; white-space: nowrap">{{l.days}}</span>
</div>
</sc-for>
</div>

<div class="paper" style="padding: 22px 22px; color: #2A2119; transform: rotate(-0.6deg); display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #3A2516">WHILE YOU'RE AWAY</span>
<span style="font-size: 14px; color: #6B5A48; margin-top: -6px">{{awayIntro}}</span>
<sc-for list="{{away}}" as="w" hint-placeholder-count="6">
<div style="{{w.row}}">
<span style="{{w.dayStyle}}">{{w.day}}</span>
<span style="font-size: 15px; line-height: 1.35">{{w.text}}</span>
</div>
</sc-for>
</div>
</div>
</div>

<!-- RIGHT: the journey -->
<div class="paper" style="padding: 24px 24px 26px; color: #2A2119; display: flex; flex-direction: column; gap: 18px; transform: rotate(0.25deg)">

<sc-if value="{{planning}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">

<sc-if value="{{landView}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #3A2516">YOUR ROUTE</span>
<div style="display: flex; flex-direction: column; border-left: 3px solid #8E2418; margin-left: 9px; padding-left: 16px; gap: 6px">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">From</span><span style="font-size: 18px; font-weight: 600; color: #1F1710">Aquea, where you are now</span></div>
<sc-for list="{{stopRows}}" as="sr" hint-placeholder-count="1">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #6B5A48">{{sr.kind}}</span><span style="font-size: 18px; font-weight: 600; color: #1F1710">{{sr.name}}</span></div>
<button onClick="{{sr.remove}}" aria-label="{{sr.aria}}" style="width: 40px; height: 40px; border: 1px solid rgba(58,37,22,0.3); background: transparent; border-radius: 50%; font-size: 18px; color: #5A3A22; cursor: pointer">×</button>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<button onClick="{{toggleAdd}}" style="{{addBtn}}">{{addLabel}}</button>
<button onClick="{{clear}}" style="min-height: 40px; padding: 6px 14px; background: transparent; color: #5A3A22; border: 1px solid rgba(58,37,22,0.35); border-radius: 3px; font-family: Spectral, serif; font-size: 14px; cursor: pointer">Clear</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #3A2516">WHICH WAY</span>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid #5A3A22; border-radius: 3px; overflow: hidden">
<sc-for list="{{segMode}}" as="o" hint-placeholder-count="3"><button onClick="{{o.click}}" style="{{o.style}}">{{o.label}}</button></sc-for>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{oceanView}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">

        label: 'font-family: "IM Fell English", serif; font-size: ' + (pl.tier === 'town' ? 22 : 26) + 'px; fill: ' + (onRoute ? '#7E1E12' : '#2A1A0E') + '; font-weight: ' + (onRoute ? 700 : 400) + '; text-anchor: ' + (right ? 'start' : 'end') + '; paint-order: stroke; stroke: rgba(246,236,212,0.9); stroke-width: 6px',
        pick: function () {
          var s0 = self.state || {};
          if ((s0.phase || 'plan') !== 'plan' || pl.id === START) return;
          var cur = (s0.stops || [3]).slice();
          var at = cur.indexOf(pl.id);
          if (at >= 0) { cur.splice(at, 1); }
          else if (s0.addMode && cur.length) { cur.splice(cur.length - 1, 0, pl.id); }
          else if (cur.length) { cur[cur.length - 1] = pl.id; }

    });
    var badges = stops.map(function (id, i) { var pl = P[id]; return { x: pl.x, y: pl.y - 34, ty: pl.y - 27, n: String(i + 1) }; });
    var youAt = phase === 'arrived' && dest ? dest : P[START];
    var you = { x: youAt.x, rx: youAt.x - 26 - 46, ry: youAt.y - 26, ix: youAt.x - 22 - 46, iy: youAt.y - 22, ty: youAt.y + 46 };
    you.x = youAt.x - 46;

    // ---------------- controls
    var seg = function (opts, cur, key) {
      return opts.map(function (o) {
        var on = o[0] === cur;
        return { label: o[1], click: set((function () { var x = {}; x[key] = o[0]; return x; })()),
          style: 'min-height: 42px; padding: 6px 4px; border: none; border-right: 1px solid rgba(90,58,34,0.35); font-family: Spectral, serif; font-size: 15px; cursor: pointer; ' +
            (on ? 'background: #3A2516; color: #FFF6E4; font-weight: 600' : 'background: rgba(255,250,238,0.4); color: #2A1A0E') };
      });
    };
    var check = function (on, label, sub, cost, key, warn) {
      return { label: label, sub: sub, cost: cost, mark: on ? '✓' : '', click: set((function () { var x = {}; x[key] = !on; return x; })()),
        subStyle: 'font-size: 13px; color: ' + (warn ? '#9C2E1E' : '#6B5A48'),
        box: 'flex: none; width: 24px; height: 24px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; ' + (on ? 'background: #2C5F50; color: #FFF6E4; border: 1px solid #2C5F50' : 'background: rgba(255,250,238,0.6); color: transparent; border: 1px solid #5A3A22'),
        style: 'display: flex; gap: 12px; align-items: center; min-height: 52px; padding: 8px 12px; background: rgba(255,250,238,0.45); border: 1px solid ' + (warn ? 'rgba(156,46,30,0.55)' : 'rgba(58,37,22,0.22)') + '; border-radius: 3px; font-family: Spectral, serif; cursor: pointer' };
    };
    var checks = [];
    checks.push(check(goods, 'Bring 20 jars of wine to sell', goods ? (land === 'cart' ? 'They ride in the carriage.' : 'Heavy: slows you down unless you take a carriage.') : 'Travel light; sell nothing on arrival.', goods ? 'cargo' : '', 'goods', goods && land !== 'cart'));
    if (needsPapers) checks.push(check(papers, 'Letter of passage for Ostoronia', papers ? 'The tyrant’s guards will wave you through.' : 'Without it, guards may turn you back or want a bribe.', '45 ', 'papers', !papers));
    if (foreignDays > 0) checks.push(check(interp, 'Take a translator', interp ? 'Lucius speaks ' + Array.from(new Set(steps.map(function (s) { return P[s.to].c; }).filter(function (c) { return !SPOKEN[c]; }).map(function (c) { return LANG[c]; }))).join(' and ') + '.' : 'You won’t understand the locals. Worse prices, more risk.', Math.round(foreignDays * 9) + ' ', 'interp', !interp));
    if (ocean) {
      checks.push(check(stores, 'Extra water and stores', stores ? 'Enough for a long calm or a wrong turn.' : 'If the wind dies, the barrels run dry.', '60 ', 'stores', !stores));
      checks.push(check(ointerp, 'Hire an interpreter for ' + O.lang, ointerp ? O.guide + ' grew up there and sails with you.' : 'Nobody there speaks Latin or Greek.', '70 ', 'ointerp', !ointerp));
      checks.push(check(steward, 'Leave Felix in full charge', steward ? 'He can sign deals up to 500  while you\u2019re gone.' : 'Deals and rents wait for you, a month or more.', '', 'steward', !steward));
    } else checks.push(check(fwd, 'Forward my letters', fwd ? 'About ' + lettersHeld + ' letters will follow you on the road.' : 'Letters wait in Aquea until you return.', fwdCost ? fwdCost + ' ' : '', 'fwd', false));

    var lastStep = steps[steps.length - 1];
    var bySea = lastStep && lastStep.e.kind === 'sea';
    var fromWest = lastStep && P[lastStep.from].x < (dest ? dest.x : 0);
    var spot = !dest ? '' : bySea ? 'the harbour steps' : (fromWest ? 'the west gate' : 'the east gate');
    var mc = dest ? { x: dest.x * 4 - 3200, z: dest.y * 4 - 2000 } : null;
    var WH = WORLD.harb;
    if (ocean) {
      dest = { name: odest, x: WH[odest][0], y: WH[odest][1] };
      spot = 'the harbour steps';
      mc = { x: 14000 + Math.round((dest.x - 1000) * 24), z: Math.round((dest.y - 500) * 24) };
    }

    var ok = !!dest && steps.length > 0;
    var going = phase === 'going', arrived = phase === 'arrived';
    var EVENTS = [
      [1, 'Felix opens the counting house without you.'],
      [2, 'The Aurora should reach Durona with the olive oil.'],
      [3, 'Market day in Aquea. Grain prices reset.'],
      [5, 'Rent from the Ferum estate: +120 .'],
      [7, 'The Senate of Caleonia votes on the salt tax.'],
      [9, 'The Thetis reaches Rhodes.'],
      [12, 'Rufus’s loan falls due. Someone must collect it.']
    ];
    if (ocean) EVENTS = EVENTS.concat([
      [15, 'The harvest comes in across Vararia. Grain prices fall.'],
      [20, 'House Fulvius moves in on your grain buyers in Durona.'],
      [26, 'Queen Cornelia\u2019s birthday games. Everyone who matters is in Aquea.'],
      [34, 'Rent from the Ferum estate: +120 .']
    ]);
    if (ocean && !steward) EVENTS.push([10, 'A buyer for your Lareanum salt gives up waiting.']);
    EVENTS.sort(function (a, b) { return a[0] - b[0]; });
    var away = EVENTS.map(function (ev) {
      var during = ev[0] <= D2;
      return { day: 'Day ' + ev[0], text: ev[1],
        row: 'display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: baseline; color: ' + (during ? '#1F1710' : '#9A8A76'),
        dayStyle: 'font-family: "IBM Plex Mono", monospace; font-size: 13px; color: ' + (during ? '#8E2418' : '#B0A08A') };
    });
    var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
    var chat = dest ? [
      { tag: '[Journey]', text: 'You arrive at ' + dest.name + ', ' + spot + '.', t: '#FFAA00' },
      { tag: '', text: cap(fmt(totDays)) + ' have passed while you travelled.', t: '#AAAAAA', plain: true },
      risk > 0.2 ? { tag: '[Road]', text: 'Bandits stopped you on the way. ' + (escort ? 'Your guards drove them off.' : 'They took 120 .'), t: '#FF5555' } : { tag: '[Road]', text: 'The road was quiet.', t: '#55FF55' },
      { tag: '[Felix]', text: fwd ? lettersHeld + ' letters are waiting in your satchel.' : lettersHeld + ' letters are waiting for you in Aquea.', t: '#FFFF55' },
      D2 >= 2 ? { tag: '[Fleet]', text: 'The Aurora made port in Durona.', t: '#55FFFF' } : { tag: '[Fleet]', text: 'The Aurora is still at sea.', t: '#55FFFF' }
    ].map(function (m) { return { tag: m.tag, text: m.text, tagStyle: 'color: ' + m.t, textStyle: m.plain ? 'color: #AAAAAA' : 'color: #FFFFFF' }; }) : [];
    if (ocean) chat = [
      { tag: '[Voyage]', text: 'You step ashore at ' + odest + ', ' + spot + '.', t: '#FFAA00' },
      { tag: '', text: D2 + ' days have passed since you left Aquea.', t: '#AAAAAA', plain: true },
      risk > 0.2 ? { tag: '[Voyage]', text: O.rough, t: '#FF5555' } : { tag: '[Voyage]', text: 'Fair winds the whole way.', t: '#55FF55' },
      ointerp ? { tag: '[' + O.guide + ']', text: 'Stay close. I\u2019ll do the talking until you learn some ' + O.lang + '.', t: '#FFFF55' } : { tag: '[Harbour]', text: 'You can\u2019t understand a word anyone says.', t: '#FF5555' },
      { tag: '[Felix]', text: lettersHeld + ' letters are waiting for you back in Aquea.', t: '#FFFF55' }
    ].map(function (m) { return { tag: m.tag, text: m.text, tagStyle: 'color: ' + m.t, textStyle: m.plain ? 'color: #AAAAAA' : 'color: #FFFFFF' }; });

    // ---------------- the world chart
    var toW = function (d) { return d.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, function (m, x, y) { return (40 + x * 0.42).toFixed(1) + ',' + (260 + y * 0.42).toFixed(1); }); };
    var worldD = ocean ? (routeD ? toW(routeD) + ' ' + O.lane.replace(/^M/, 'L') : O.lane) : '';
    var youW = phase === 'arrived' && ocean ? { x: WH[odest][0], y: WH[odest][1] } : { x: 358, y: 560 };
    var lbl = function (x, y, t, st) { return { x: x, y: y, t: t, style: st }; };
    var bigLbl = 'font-family: Cinzel, serif; font-size: 30px; font-weight: 700; letter-spacing: 0.35em; fill: rgba(58,37,22,0.55); text-anchor: middle';
    var seaLbl = 'font-family: Cinzel, serif; font-size: 28px; font-weight: 500; letter-spacing: 0.5em; fill: rgba(24,52,72,0.5); text-anchor: middle';
    var smallLbl = 'font-family: "IM Fell English", serif; font-size: 24px; fill: #3A2516; text-anchor: middle; paint-order: stroke; stroke: rgba(234,219,182,0.8); stroke-width: 5px';
    var swells = [];
    for (var sy = 80; sy < 1000; sy += 92) for (var sx = (sy / 92) % 2 ? 60 : 160; sx < 1600; sx += 210) {
      if (sx > 70 && sx < 720 && sy > 300 && sy < 680) continue;
      if (sx > 950 && sx < 1560 && sy > 110 && sy < 900) continue;
      swells.push({ d: 'M' + sx + ',' + sy + ' q14,-9 28,0 q14,9 28,0' });
    }
    var world = {
      swells: swells,
      home: D.countries.map(function (c) { return { d: c[2], tint: 'fill: ' + c[1] + '; fill-opacity: 0.2; stroke: ' + c[1] + '; stroke-opacity: 0.6; stroke-width: 4px' }; }),
      landPath: ocean && routeD ? routeD : 'M0,0',
      lands: [
        { d: WORLD.n, fill: 'fill: #E8D9B4; stroke: #5A3A22; stroke-width: 2.5px' }, { d: WORLD.s, fill: 'fill: #E8D9B4; stroke: #5A3A22; stroke-width: 2.5px' },
        { d: WORLD.n, fill: 'fill: #4F7A5A; fill-opacity: 0.2; stroke: none' }, { d: WORLD.s, fill: 'fill: #A0522D; fill-opacity: 0.2; stroke: none' },
        { d: WORLD.far, fill: 'fill: #E8D9B4; stroke: #5A3A22; stroke-width: 2px' }
      ].concat(WORLD.isles.map(function (d) { return { d: d, fill: 'fill: #E8D9B4; stroke: #5A3A22; stroke-width: 2px' }; })),
      border: WORLD.border,
      labels: [lbl(1270, 96, 'AURELIA', bigLbl), lbl(380, 280, 'YOUR LANDS', bigLbl), lbl(470, 860, 'THE OUTER SEA', seaLbl),
        lbl(1290, 330, 'Kingdom of Thessar', smallLbl), lbl(1300, 650, 'Mirenian League', smallLbl), lbl(838, 735, 'The Fortunate Isles', smallLbl), lbl(1500, 168, 'Unknown', smallLbl)],
      lanes: Object.keys(OCEAN).map(function (k) { var on = ocean && k === odest;
        return { d: OCEAN[k].lane, style: 'fill: none; stroke: ' + (on ? '#8E2418' : '#1E3E5A') + '; stroke-opacity: ' + (on ? 1 : 0.55) + '; stroke-width: ' + (on ? 5 : 3) + 'px; stroke-dasharray: ' + (on ? '18 10' : '10 10') + '; stroke-linecap: round' + (on ? '; animation: march 1.6s linear infinite' : '') }; }),
      dangers: ocean && phase !== 'arrived' ? [{ x: O.danger[0], y: O.danger[1], ty: O.danger[1] + 8, ly: O.danger[1] - 24, label: O.danger[2] }] : [],
      homePorts: [{ name: 'Coria', x: 585, y: 345, lx: 572, ly: 336 }, { name: 'Sabino', x: 636, y: 630, lx: 623, ly: 664 }],
      ports: Object.keys(WH).map(function (k) {
        var on = ocean && k === odest, p = WH[k];
        return { name: k, x: p[0], y: p[1], lx: p[0] + 20, ly: p[1] + 8, title: 'Sail to ' + k + ' (' + OCEAN[k].region + ')',
          dot: 'fill: ' + (on ? '#C9962A' : '#8E2418') + '; stroke: #F6EAD0; stroke-width: 3px',
          label: 'font-family: "IM Fell English", serif; font-size: 27px; font-weight: ' + (on ? 700 : 400) + '; fill: ' + (on ? '#7E1E12' : '#2A1A0E') + '; paint-order: stroke; stroke: rgba(234,219,182,0.92); stroke-width: 6px',
          pick: function () { if (((self.state || {}).phase || 'plan') !== 'plan') return; put({ odest: k }); } };
      }),
      hasBadge: ocean && phase !== 'arrived',
      badge: { x: WH[odest][0], y: WH[odest][1] - 36, ty: WH[odest][1] - 29 },
      you: { x: youW.x - 46, rx: youW.x - 72, ry: youW.y - 26, ix: youW.x - 68, iy: youW.y - 22, ty: youW.y + 46 }
    };

    var navItem = function (label, active) {
      return { label: label, style: 'display: inline-flex; align-items: center; min-height: 40px; padding: 6px 14px; text-decoration: none; font-size: 16px; border-bottom: 2px solid ' + (active ? '#E9C982' : 'transparent') + '; color: ' + (active ? '#FFF6E4' : '#D9D2C4') };
    };

    return {
      whereHeader: arrived && dest ? dest.name.toUpperCase() + ' · ' + spot.toUpperCase() : 'AQUEA · THE FORUM',
      hereChip: arrived && dest ? 'You are in ' + dest.name : 'You are in Aquea',
      nav: __NAV.top('Travel', navItem), subnav: __NAV.sub('Travel'), hasSub: __NAV.sub('Travel').length > 0,
      countries: countries, roads: roads, routeD: routeD || 'M0,0', towns: towns, badges: arrived ? [] : badges, dangers: arrived ? [] : dangers,
      showYou: !going, you: you, going: going,
      traveller: 'position: absolute; left: 0; top: 0; offset-path: path(\'' + ((ocean ? worldD : routeD) || 'M0,0') + '\'); offset-rotate: 0deg; animation: journey 3.4s ease-in-out forwards',
      mapHint: going ? (ocean ? 'Under sail…' : 'On the road…') : ocean ? 'Click a harbour across the sea to sail there.' : addMode ? 'Click a town to add it as a stop before your destination.' : 'Click a town to travel there. Click a stop again to remove it.',
      legsTitle: ocean ? 'THE VOYAGE, STEP BY STEP' : 'THE ROAD, STEP BY STEP',
      legCount: steps.length ? steps.length + ' stages, ' + fmt(totDays) : 'Pick a destination',
      legs: legs,
      awayIntro: dest ? fmt(totDays).replace(/^\d/, function (c) { return c; }) + ' will pass in the world while you’re on the road.' : 'Pick a destination to see what happens while you travel.',
      away: away,
      planning: !arrived,
      landView: !ocean, oceanView: ocean, world: world,
      scopes: [['land', 'This continent'], ['ocean', 'Across the ocean']].map(function (o) { var on = scope === o[0];
        return { label: o[1], click: set({ scope: o[0] }), style: 'min-height: 40px; padding: 6px 18px; border: none; border-radius: 999px; font-family: Spectral, serif; font-size: 15px; cursor: pointer; ' + (on ? 'background: #E9C982; color: #2A1A0E; font-weight: 600' : 'background: transparent; color: #E6D6B4') }; }),
      scopeHint: ocean ? 'Weeks at sea. The world won\u2019t wait for you.' : 'Roads, tracks and coastal ships',
      landLabel: ocean ? 'To the harbour at ' + O.from : 'On land',
      oDests: Object.keys(OCEAN).map(function (k) { var o = OCEAN[k], on = k === odest;
        return { name: k, sub: o.region + ', via ' + o.from + '. Sells ' + o.sells + '.', days: '~' + Math.round(oDays[k]) + ' days from port', click: set({ odest: k }),
          style: 'display: flex; gap: 10px; align-items: center; min-height: 56px; padding: 8px 12px; border-radius: 3px; font-family: Spectral, serif; cursor: pointer; ' + (on ? 'background: rgba(201,150,42,0.22); border: 2px solid #9A6A12' : 'background: rgba(255,250,238,0.45); border: 1px solid rgba(58,37,22,0.25)') }; }),
      segShip: seg([['berth', 'A berth'], ['charter', 'Charter'], ['own', 'Your own ship']], oship, 'oship').map(function (b, i) { if (i === 2) { b.click = function () {}; b.style += '; opacity: 0.45; cursor: not-allowed'; } return b; }),
      shipNote: oship === 'berth' ? 'The ' + O.ship + ' sails from ' + O.from + ' in ' + O.wait + ' days. ' + O.berth + '  for a berth.' : 'Leave as soon as you reach ' + O.from + ', with room for all your cargo. ' + O.charter + ' .',
      stopRows: stops.map(function (id, i) { return { name: P[id].name, kind: i === stops.length - 1 ? 'To' : 'Stop ' + (i + 1), aria: 'Remove ' + P[id].name, remove: set({ stops: stops.filter(function (x) { return x !== id; }) }) }; }),
      toggleAdd: set({ addMode: !addMode }),
      addLabel: addMode ? 'Now click a town…' : '+ Add a stop on the way',
      addBtn: 'flex: 1; min-height: 40px; padding: 6px 14px; border-radius: 3px; font-family: Spectral, serif; font-size: 14px; cursor: pointer; ' + (addMode ? 'background: #C9962A; color: #2A1A0E; border: 1px solid #8A6418; font-weight: 600' : 'background: transparent; color: #2A1A0E; border: 1px solid #5A3A22'),
      clear: set({ stops: [] }),
      segMode: seg([['fast', 'Fastest'], ['safe', 'Safest'], ['cheap', 'Cheapest']], mode, 'mode'),
      segLand: seg([['foot', 'On foot'], ['horse', 'Horse'], ['cart', 'Carriage']], land, 'land'),
      segSea: seg([['passage', 'Book passage'], ['boat', 'Hire a boat']], sea, 'sea'),
      segEscort: seg([[0, 'None'], [1, 'Two guards'], [2, 'Six guards']], escort, 'escort'),
      segPurse: seg([[0, '200'], [1, '800'], [2, '2,000']], purse, 'purse'),
      purseNote: 'Enough to trade on arrival. If you’re robbed, you could lose up to ' + ['200', '800', '2,000'][purse] + ' .',
      checks: checks,
      totals: [
        { k: 'Time', v: dest ? (ocean ? Math.round(totDays) + '–' + Math.round(totDays + spread) + ' days' : fmt(totDays)) : '—', sub: dest ? (ocean ? 'the wind decides' : 'arrive day ' + Math.max(1, Math.ceil(totDays))) : '', style: 'font-family: Cinzel, serif; font-size: 22px; font-weight: 700; color: #2A1A0E' },
        { k: 'Cost', v: dest ? total + ' ' : '—', sub: dest ? 'food, fares, wages' : '', style: 'font-family: Cinzel, serif; font-size: 22px; font-weight: 700; color: #2A1A0E' },
        { k: 'Danger', v: dest ? riskWord : '—', sub: dest ? Math.round(risk * 100) + '% chance of trouble' : '', style: 'font-family: Cinzel, serif; font-size: 22px; font-weight: 700; color: ' + riskColor }
      ],
      arrive: dest ? { title: 'You’ll appear at ' + dest.name + ', ' + spot, sub: 'x ' + mc.x + '  z ' + mc.z + '  ·  in Minecraft' } : { title: 'No destination yet', sub: 'Pick a town on the map' },
      teleport: function () {
        var s0 = self.state || {};
        if ((s0.phase || 'plan') !== 'plan' || !ok) return;
        put({ phase: 'going' });
        setTimeout(function () { put({ phase: 'arrived' }); }, 3500);
      },
      tpLabel: going ? 'On the road…' : ok ? 'Teleport to ' + dest.name : 'Pick a destination',
      tpSub: ok ? (ocean ? 'About ' + Math.round(totDays) + ' days' : fmt(totDays)) + ' pass · ' + total + ' ' : 'Then press to go',
      tpStyle: 'display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 70px; padding: 10px 16px; border: none; border-radius: 4px; color: #2A1A0E; cursor: ' + (ok && !going ? 'pointer' : 'default') + '; ' +
        (ok ? 'background: linear-gradient(180deg, #F2D58A 0%, #D9AE52 55%, #B88A2E 100%); animation: glow 2.6s ease-in-out infinite' : 'background: rgba(58,37,22,0.12); color: #6B5A48') + (going ? '; opacity: 0.7' : ''),
      tpNote: (ocean ? 'A month is a long time. Make sure someone you trust minds the business. ' : '') + 'You’re moved the moment you press. If you’re offline, you’ll wake up there next time you log in.',
      arrived: arrived,
      done: dest ? { title: 'Welcome to ' + dest.name, sub: (ocean ? D2 + ' days at sea and on the road.' : cap(fmt(totDays)) + ' on the road.') + ' You spent ' + total + ' .', chat: chat, market: 'Open the ' + dest.name + ' market' } : { title: '', sub: '', chat: [], market: '' },
      reset: function () { put({ phase: 'plan', stops: [3] }); }
    };
  }
}

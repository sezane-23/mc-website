<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Politics — the table of power</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Spectral:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Cinzel';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Spectral';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IBM Plex Mono';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'IM Fell English';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'VT323';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Georgia';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}@font-face{font-family:'Sestertius';src:url(assets/2f5670a98fe7508178625142c756af03.woff2) format('woff2');unicode-range:U+E000;font-weight:100 900;font-style:normal}

body{margin:0;background:#0E0905}
html,body,*{scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none;width:0;height:0}
a{color:#F3D27E}a:hover{color:#FFF0C0}
.paper{background-color:#EFE3C8;background-image:linear-gradient(155deg, rgba(255,251,238,0.45) 0%, rgba(255,251,238,0) 38%, rgba(110,72,36,0.10) 100%), radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 62%, rgba(104,66,30,0.22) 100%), url(assets/9c7efc059b51944b3cd05c0456c88232.jpg);background-size:auto, auto, 420px 420px}
.wood{background-color:#2A1B10;background-image:url(assets/f8781ae71473f5b064757900db65402c.jpg);background-size:512px 512px}
@keyframes flicker{0%,100%{opacity:1}22%{opacity:0.86}40%{opacity:0.97}63%{opacity:0.82}80%{opacity:0.95}}
@keyframes flame{0%,100%{transform:scale(1,1) rotate(-1.5deg)}30%{transform:scale(0.95,1.05) rotate(1.5deg)}60%{transform:scale(1.03,0.96) rotate(-0.5deg)}}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">
<div style="min-height: 100vh; background: radial-gradient(ellipse at 40% 80%, #22160D 0%, #0E0905 70%); color: #F2E8D5; font-family: Spectral, Georgia, serif; font-size: 17px; line-height: 1.5">

<!-- TOP BAR -->
<header style="max-width: 1440px; margin: 0 auto; padding: 18px 32px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 28px">
<span style="font-family: Cinzel, serif; font-size: 15px; letter-spacing: 0.14em; color: #E9C982">AQUEA · IDES OF OCTOBER · NIGHT</span>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="{{n.style}}">{{n.label}}</a>
</sc-for>
</nav>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; color: #F3D27E">4,820 </span>
</header>
<sc-if value="{{hasSub}}" hint-placeholder-val="{{ true }}">
<nav aria-label="Section" style="max-width: 1440px; margin: -6px auto 0; padding: 0 32px 8px; box-sizing: border-box; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap">
<sc-for list="{{subnav}}" as="sn" hint-placeholder-count="4"><a href="#" style="{{sn.style}}">{{sn.label}}</a></sc-for>
</nav>
</sc-if>

<main style="max-width: 1440px; margin: 0 auto; padding: 4px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<!-- YOUR PERSON READS THIS PAGE FOR YOU -->
<section aria-label="Summary" style="display: grid; grid-template-columns: 1fr 360px; gap: 22px; padding: 16px 20px; background: #EFE3C8; color: #2A2119; border-radius: 3px; box-shadow: 0 14px 30px rgba(0,0,0,0.45); border-left: 6px solid #9A6A12">
<div style="display: flex; gap: 16px; align-items: flex-start">
<img src="{{aide.face}}" alt="" style="flex: none; width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 3px #F6EAD0, 0 4px 10px rgba(0,0,0,0.3)">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #7E2A1A">{{aide.head}}</span>
<sc-for list="{{aide.says}}" as="ai" hint-placeholder-count="3"><span style="{{ai.style}}">{{ai.t}}</span></sc-for>
<span style="font-size: 13px; color: #6B5A48">{{aide.foot}}</span>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-left: 20px; border-left: 1px solid rgba(58,37,22,0.2)">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #6B5A48">{{aide.askLabel}}</span>
<div role="radiogroup" aria-label="{{aide.askLabel}}" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px">
<sc-for list="{{aide.levels}}" as="al" hint-placeholder-count="3"><button role="radio" aria-checked="{{al.on}}" onClick="{{al.click}}" style="{{al.style}}">{{al.label}}</button></sc-for>
</div>
<span style="font-size: 14px; line-height: 1.4; color: #1F1710">{{aide.will}}</span>
</div>
</section>


<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #C9A86A">THE KINGDOM OF VARARIA</span>
<h1 style="margin: 0; font-family: Cinzel, serif; font-size: 34px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">Who holds power, by your lamplight</h1>
</div>
<p style="margin: 0; max-width: 520px; font-size: 16px; color: #E6D8BC">Your lamp lights only as far as your standing reaches. Rise, and you will see further up the table. Click anyone to open what you know of them.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">

<!-- THE TABLE -->
<div style="flex: none; width: 1000px; max-width: 100%; overflow-x: auto">
<div class="wood" style="position: relative; width: 1000px; height: 1000px; overflow: hidden; border-radius: 4px; box-shadow: 0 30px 60px rgba(0,0,0,0.7), inset 0 0 0 2px #3A2616">

<!-- threads -->
<svg width="1000" height="1000" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<sc-for list="{{threads}}" as="t" hint-placeholder-count="12">
<path d="{{t.d}}" style="{{t.style}}"></path>
<text x="{{t.lx}}" y="{{t.ly}}" style="{{t.labelStyle}}">{{t.label}}</text>
</sc-for>
</svg>

<!-- pinned notes -->
<sc-for list="{{notes}}" as="nt" hint-placeholder-count="2">
<div class="paper" style="{{nt.style}}">
<span style="display: block; width: 10px; height: 10px; margin: -14px auto 6px; border-radius: 50%; background: #8E2C1C; box-shadow: 0 2px 3px rgba(0,0,0,0.5)"></span>
<span style="font-family: Cinzel, serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #7E2A1A">{{nt.head}}</span>
<span style="display: block; font-size: 13px; line-height: 1.35; color: #1F1710">{{nt.text}}</span>
</div>
</sc-for>

<!-- people -->
<sc-for list="{{people}}" as="p" hint-placeholder-count="14">
<button class="paper" onClick="{{p.pick}}" aria-label="{{p.aria}}" style="{{p.style}}">
<div style="padding: 3px; background: #EFE3C8; box-shadow: 0 3px 8px rgba(0,0,0,0.35)">
<sc-if value="{{p.known}}" hint-placeholder-val="{{ true }}">
<img src="{{p.face}}" alt="" style="display: block; width: 52px; height: 52px; image-rendering: pixelated">
</sc-if>
<sc-if value="{{p.hidden}}" hint-placeholder-val="{{ false }}">
<svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" style="fill: #2A1E14"></rect><circle cx="24" cy="18" r="9" style="fill: #5A4A3A"></circle><path d="M8 48c2-11 9-16 16-16s14 5 16 16z" style="fill: #5A4A3A"></path></svg>
</sc-if>
</div>
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; line-height: 1.2; color: #2A1A0E; text-align: center">{{p.name}}</span>
<span style="font-size: 12px; line-height: 1.25; color: #5E5042; text-align: center">{{p.role}}</span>
</button>
</sc-for>

<!-- letters lying on the table -->
<sc-for list="{{letters}}" as="lt" hint-placeholder-count="2">
<button onClick="{{lt.pick}}" aria-label="{{lt.aria}}" class="paper" style="{{lt.style}}">
<img src="{{lt.seal}}" alt="" style="position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; transform: translate(-50%, -50%) rotate(-10deg); filter: drop-shadow(0 2px 3px rgba(30,10,5,0.5))">
<svg width="100" height="62" viewBox="0 0 100 62" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M2 2 L50 34 L98 2" style="fill: none; stroke: rgba(90,58,34,0.45); stroke-width: 1.2px"></path></svg>
</button>
</sc-for>

<!-- the lamp -->
<div style="position: absolute; left: 480px; top: 757px; width: 170px; height: 170px; pointer-events: none">
<div style="position: absolute; left: 22px; top: 140px; width: 120px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.5); filter: blur(6px)"></div>
<img src="assets/a0564ea984b87e60be2f55ea6e9d104c.png" alt="" style="position: absolute; left: 0; top: 0; width: 170px; height: 170px; transform-origin: 74.6% 61.7%; animation: flame 1.7s ease-in-out infinite">
<img src="assets/ece2bf18c9720b7bf9dad4908fbdffc9.png" alt="" style="position: absolute; left: 0; top: 0; width: 170px; height: 170px">
</div>

<!-- darkness beyond your reach, and the lamp's glow -->
<div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 606px 838px, rgba(6,4,2,0) 0px, rgba(6,4,2,0) 250px, rgba(6,4,2,0.32) 400px, rgba(6,4,2,0.66) 590px, rgba(6,4,2,0.86) 800px, rgba(6,4,2,0.9) 1000px)"></div>
<div style="position: absolute; inset: 0; pointer-events: none; animation: flicker 3.4s ease-in-out infinite; background: radial-gradient(circle at 606px 838px, rgba(255,166,72,0.26) 0px, rgba(255,166,72,0.1) 220px, rgba(255,166,72,0) 460px)"></div>

<div style="position: absolute; left: 24px; top: 22px; display: flex; flex-direction: column; gap: 2px; pointer-events: none">
<span style="font-family: Cinzel, serif; font-size: 12px; letter-spacing: 0.16em; color: rgba(233,201,130,0.55)">THE CROWN</span>
</div>
<div style="position: absolute; right: 24px; bottom: 18px; pointer-events: none; font-size: 13px; color: rgba(242,232,213,0.75)">Your reach: <span style="color: #F3D27E">respected</span>, the town and its harbour</div>
</div>
</div>

<!-- THE DOSSIER -->
<aside class="paper" style="flex: 1 1 320px; max-width: 380px; align-self: stretch; min-height: 1000px; box-sizing: border-box; padding: 26px 26px 30px; color: #2A2119; box-shadow: 0 24px 50px rgba(0,0,0,0.65); display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{d.isPerson}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="flex: none; padding: 4px; background: #EFE3C8; box-shadow: 0 4px 10px rgba(0,0,0,0.35); transform: rotate(-3deg)">
<sc-if value="{{d.known}}" hint-placeholder-val="{{ true }}"><img src="{{d.face}}" alt="" style="display: block; width: 64px; height: 64px; image-rendering: pixelated"></sc-if>
<sc-if value="{{d.hidden}}" hint-placeholder-val="{{ false }}"><svg width="64" height="64" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" style="fill: #2A1E14"></rect><circle cx="24" cy="18" r="9" style="fill: #5A4A3A"></circle><path d="M8 48c2-11 9-16 16-16s14 5 16 16z" style="fill: #5A4A3A"></path></svg></sc-if>
</div>
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #6B5A48">{{d.role}}</span>
<span style="font-family: Cinzel, serif; font-size: 21px; font-weight: 700; line-height: 1.2; color: #2A1A0E">{{d.name}}</span>
<span style="{{d.tagStyle}}">{{d.tag}}</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">WHAT THEY WANT</span>
<p style="margin: 0; font-size: 17px; color: #1F1710">{{d.want}}</p>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">WHAT YOU KNOW</span>
<sc-for list="{{d.know}}" as="k" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; padding-left: 10px; border-left: 3px solid rgba(90,58,34,0.3)">
<span style="font-size: 16px; color: #1F1710">{{k.text}}</span>
<span style="font-size: 13px; color: #6B5A48">{{k.src}} · <span style="{{k.sureStyle}}">{{k.sure}}</span></span>
</div>
</sc-for>
<sc-if value="{{d.knowsNothing}}" hint-placeholder-val="{{ false }}"><span style="font-size: 16px; color: #6B5A48">Nothing. Not even a name.</span></sc-if>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">WAYS TO MOVE</span>
<sc-for list="{{d.ways}}" as="w" hint-placeholder-count="3">
<button style="text-align: left; display: flex; flex-direction: column; gap: 2px; min-height: 44px; padding: 10px 12px; background: rgba(255,250,238,0.5); border: 1px solid rgba(90,58,34,0.35); border-radius: 2px; font-family: Spectral, serif; cursor: pointer">
<span style="font-size: 16px; font-weight: 600; color: #1F1710">{{w.act}}</span>
<span style="font-size: 14px; color: #5E5042">{{w.then}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{d.isLetter}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 14px; align-items: center">
<img src="{{d.seal}}" alt="" style="width: 64px; height: 64px; transform: rotate(-10deg); filter: drop-shadow(0 4px 6px rgba(30,10,5,0.45))">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #6B5A48">A LETTER FROM</span>
<span style="font-family: Cinzel, serif; font-size: 20px; font-weight: 700; line-height: 1.2; color: #2A1A0E">{{d.name}}</span>
</div>
</div>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #1F1710">{{d.text}}</p>
<span style="font-size: 15px; color: #7E2A1A">{{d.deadline}}</span>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{d.paths}}" as="pa" hint-placeholder-count="3">
<button style="{{pa.style}}">
<span style="font-size: 17px; font-weight: 600; color: #1F1710">{{pa.title}}</span>
<span style="font-size: 14px; color: #2C5F50">{{pa.gain}}</span>
<span style="font-size: 14px; color: #8E2C1C">{{pa.cost}}</span>
</button>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{d.isYou}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #6B5A48">YOU</span>
<span style="font-family: Cinzel, serif; font-size: 21px; font-weight: 700; color: #2A1A0E">A respected merchant of Aquea</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{ranks}}" as="k" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px"><span style="{{k.dot}}"></span><span style="{{k.style}}">{{k.name}}</span><span style="font-size: 13px; color: #6B5A48; margin-left: auto">{{k.opens}}</span></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid rgba(90,58,34,0.25)">
<span style="font-size: 14px; color: #6B5A48">To be honoured, any two of:</span>
<span style="font-size: 15px; color: #4A3C30">○ Wealth of 25,000  (about 17,000 now)</span>
<span style="font-size: 15px; color: #4A3C30">○ A public work funded in Aquea</span>
<span style="font-size: 15px; color: #2C5F50">✓ A friend on the royal council</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(90,58,34,0.25)">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">THE WEIGHT OF YOUR PURSE</span>
<span style="font-size: 15px; color: #1F1710">Envy you draw: <strong>low</strong>. Staying small keeps you safe and ignored. Growing opens doors, and fills your table with people who want things.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(90,58,34,0.25)">
<span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">TONGUES</span>
<span style="font-size: 15px; color: #1F1710">Varan, and a little Caleonian. In Ostoronia you would need a translator, or miss what is said behind your back.</span>
</div>
</div>
</sc-if>
</aside>
</div>
<!-- THE FIVE COUNTRIES: run by their own rulers, with or without you -->
<section aria-label="The five countries" style="display: flex; flex-direction: column; gap: 18px; margin-top: 26px; padding-top: 26px; border-top: 1px solid rgba(233,201,130,0.2)">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px">
<div style="display: flex; flex-direction: column">
<span style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 0.18em; color: #C9A86A">FIVE COUNTRIES, FIVE WAYS TO RULE</span>
<h2 style="margin: 0; font-family: Cinzel, serif; font-size: 28px; font-weight: 700; letter-spacing: 0.05em; color: #FFF6E4">The rulers play without you</h2>
</div>
<p style="margin: 0; max-width: 560px; font-size: 16px; color: #E6D8BC">Offices, votes and laws all happen on their own. You only need to know what’s coming. If you want, you can lean on it.</p>
</div>
<div role="tablist" aria-label="Country" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px">
<sc-for list="{{lands}}" as="la" hint-placeholder-count="5"><button role="tab" onClick="{{la.click}}" style="{{la.style}}"><span style="font-family: Cinzel, serif; font-size: 17px; font-weight: 700">{{la.name}}</span><span style="font-size: 13px; opacity: 0.85">{{la.type}}</span><span style="{{la.flagStyle}}">{{la.flag}}</span></button></sc-for>
</div>

<div class="paper" style="padding: 26px 28px; color: #2A2119; box-shadow: 0 24px 50px rgba(0,0,0,0.6); display: grid; grid-template-columns: 330px 1fr 1fr; gap: 28px; align-items: start">
<!-- how power works -->
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 12px; align-items: center"><img src="{{land.face}}" alt="" style="width: 56px; height: 56px; image-rendering: pixelated; box-shadow: 0 0 0 3px #F6EAD0, 0 4px 10px rgba(0,0,0,0.3)"><span style="display: flex; flex-direction: column"><span style="font-family: Cinzel, serif; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #7E2A1A">{{land.typeUpper}}</span><span style="font-family: Cinzel, serif; font-size: 20px; font-weight: 700; line-height: 1.2; color: #2A1A0E">{{land.ruler}}</span></span></div>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #1F1710">{{land.how}}</p>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid rgba(90,58,34,0.25)">
<span style="display: flex; gap: 8px; font-size: 14px"><span style="flex: none; width: 104px; color: #6B5A48">Laws come from</span><span style="color: #1F1710">{{land.laws}}</span></span>
<span style="display: flex; gap: 8px; font-size: 14px"><span style="flex: none; width: 104px; color: #6B5A48">Good for trade</span><span style="color: #2C5F50">{{land.good}}</span></span>
<span style="display: flex; gap: 8px; font-size: 14px"><span style="flex: none; width: 104px; color: #6B5A48">Danger</span><span style="color: #8E2C1C">{{land.danger}}</span></span>
<span style="display: flex; gap: 8px; font-size: 14px"><span style="flex: none; width: 104px; color: #6B5A48">What you own here</span><span style="color: #1F1710">{{land.yours}}</span></span>
</div>
</div>
<!-- blocs and offices -->
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">

</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid rgba(90,58,34,0.25)">
<span style="font-family: Cinzel, serif; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; color: #7E2A1A">OFFICES THAT TOUCH YOUR TRADE</span>

<span style="font-size: 15px; font-weight: 600; color: #1F1710">{{of.title}}</span><span style="font-size: 13px; color: #6B5A48; text-align: right">{{of.holder}}</span>
<span style="grid-column: 1 / -1; font-size: 13px; color: #4A3C30">{{of.power}}</span>
</div>
</sc-for>
</div>
</div>
<!-- coming up, and leaning on it -->
<div style="display: flex; flex-direction: column; gap: 8px">

<sc-for list="{{land.coming}}" as="cm" hint-placeholder-count="3">

<span style="font-size: 14px; color: #2E5878">{{cm.effect}}</span>

</sc-for>
</div>
</div>
</section>
